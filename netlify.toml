[functions]
  directory = "netlify/functions"

# 14:15 and 22:15 UTC ≈ 9:15am / 5:15pm US Central during the football
# season (CDT, UTC-5, roughly Aug-early Nov). After the November DST
# shift back to CST (UTC-6) this drifts an hour earlier local time
# (8:15am/4:15pm) until DST resumes in spring — Netlify's scheduled
# functions run on fixed UTC cron, so a single schedule can't track DST.
# Adjust the hours below if that drift matters to you.
[functions."social-draft"]
  schedule = "15 14,22 * * *"

# 15:07 UTC ≈ 10:07am US Central (CDT). The Daily Challenge itself rolls
# over at each individual user's own local midnight (see todayStr() in
# app.js), so there's no single server time that lines up with everyone's
# reset — this just picks a reasonable "most people are up" broadcast time.
[functions."send-daily-push"]
  schedule = "7 15 * * *"

# NFL/CFB data refresh -- four SEPARATE scheduled functions, one per
# dataset, staggered 30 minutes apart starting at 09:10 UTC (deliberately
# off-peak, before either schedule above, so a slow refresh run never
# overlaps with send-daily-push's own invocation). Real reason these are
# four functions instead of one looping over all four datasets: the
# Gateway enforces a GLOBAL (not per-dataset) concurrency guard -- only one
# refresh runs at a time, since the machine is a single shared-CPU,
# 1GB-memory box and each refresh backs up the full ~1.6GB Engine DB (see
# gateway/services/admin_refresh.py's module docstring). Firing all four
# trigger calls back-to-back would only ever actually run the first one --
# each POST returns immediately (real work is backgrounded), so the
# 2nd/3rd/4th would arrive mid-run and get ALREADY_RUNNING every day.
#
# 30 minutes, not the original 10: a real, live production run of
# nfl_games_refresh measured 11m24s end-to-end (backup+verify, download,
# stage/publish, post-refresh sanity check) -- almost 4x the "130-200s"
# figure that number was based on (that estimate held for the roster
# refreshes' lighter local-dev testing, not a full run against the real
# Fly volume's slower I/O). 10 minutes was not a safe buffer; 30 minutes
# gives real margin above the measured worst case. Rosters/players/
# schedules change slowly (not multiple times a day, unlike in-game
# content), so once daily per dataset is the right cadence -- see
# tools/data_refresh/{nfl_refresh,cfb_refresh,nfl_games_refresh,
# cfb_games_refresh}.py for what these actually trigger.
[functions."trigger-refresh-nfl"]
  schedule = "10 9 * * *"

[functions."trigger-refresh-cfb"]
  schedule = "40 9 * * *"

[functions."trigger-refresh-nfl-games"]
  schedule = "10 10 * * *"

[functions."trigger-refresh-cfb-games"]
  schedule = "40 10 * * *"

# Historical Engine Enrichment operation: draft_facts had no automatic
# refresh anywhere in this repo (confirmed by grep) and was capped at 2024.
# Fifth dataset, same 30-minutes-apart stagger as the four above, same
# global-concurrency-guard reasoning (see refresh_shared.js) -- draft picks
# change far less often than schedules/scores (once a year, in the spring),
# so daily is generous headroom, not a requirement.
[functions."trigger-refresh-nfl-draft"]
  schedule = "10 11 * * *"

# Historical Engine Enrichment operation, continuation: player_season_stats
# had zero rows before this -- sixth dataset, same 30-minutes-apart stagger.
[functions."trigger-refresh-nfl-player-stats"]
  schedule = "40 11 * * *"
