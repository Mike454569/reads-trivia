[functions]
  directory = "netlify/functions"

# 14:15 and 22:15 UTC ≈ 9:15am / 5:15pm US Central during the football
# season (CDT, UTC-5, roughly Aug-early Nov). After the November DST
# shift back to CST (UTC-6) this drifts an hour earlier local time
# (8:15am/4:15pm) until DST resumes in spring — Netlify's scheduled
# functions run on fixed UTC cron, so a single schedule can't track DST.
# Adjust the hours below if that drift matters to you.
[functions."social-draft"]
  schedule = "15 14,22 * * *"

# 15:07 UTC ≈ 10:07am US Central (CDT). The Daily Challenge itself rolls
# over at each individual user's own local midnight (see todayStr() in
# app.js), so there's no single server time that lines up with everyone's
# reset — this just picks a reasonable "most people are up" broadcast time.
[functions."send-daily-push"]
  schedule = "7 15 * * *"

# NFL/CFB data refresh -- four SEPARATE scheduled functions, one per
# dataset, staggered 30 minutes apart starting at 09:10 UTC (deliberately
# off-peak, before either schedule above, so a slow refresh run never
# overlaps with send-daily-push's own invocation). Real reason these are
# four functions instead of one looping over all four datasets: the
# Gateway enforces a GLOBAL (not per-dataset) concurrency guard -- only one
# refresh runs at a time, since the machine is a single shared-CPU,
# 1GB-memory box and each refresh backs up the full ~1.6GB Engine DB (see
# gateway/services/admin_refresh.py's module docstring). Firing all four
# trigger calls back-to-back would only ever actually run the first one --
# each POST returns immediately (real work is backgrounded), so the
# 2nd/3rd/4th would arrive mid-run and get ALREADY_RUNNING every day.
#
# 30 minutes, not the original 10: a real, live production run of
# nfl_games_refresh measured 11m24s end-to-end (backup+verify, download,
# stage/publish, post-refresh sanity check) -- almost 4x the "130-200s"
# figure that number was based on (that estimate held for the roster
# refreshes' lighter local-dev testing, not a full run against the real
# Fly volume's slower I/O). 10 minutes was not a safe buffer; 30 minutes
# gives real margin above the measured worst case. Rosters/players/
# schedules change slowly (not multiple times a day, unlike in-game
# content), so once daily per dataset is the right cadence -- see
# tools/data_refresh/{nfl_refresh,cfb_refresh,nfl_games_refresh,
# cfb_games_refresh}.py for what these actually trigger.
[functions."trigger-refresh-nfl"]
  schedule = "10 9 * * *"

[functions."trigger-refresh-cfb"]
  schedule = "40 9 * * *"

[functions."trigger-refresh-nfl-games"]
  schedule = "10 10 * * *"

[functions."trigger-refresh-cfb-games"]
  schedule = "40 10 * * *"

# Dynamic Weekly Pick'em pass: real, disclosed limitation -- neither
# nflverse's games.csv nor cfbfastR's schedules CSV is a live in-play feed
# (confirmed directly), so "faster status/score updates during game
# windows" can only ever mean "run this SAME batch refresh more often,"
# never true live scoring. Deliberately modest, not hourly: each refresh's
# own backup step copies the FULL production DB (multiple GB) before
# writing anything (tools/data_refresh/safety.py's create_verified_backup),
# and the Gateway runs on a single shared-CPU, 1GB-memory box
# (gateway/fly.toml) with a global one-refresh-at-a-time concurrency guard
# -- an aggressive cadence here risks near-continuous heavy I/O on that
# same small box, not just fresher data. These three extra Sunday triggers
# (afternoon/evening/late ET windows, accounting for most real NFL kickoff
# clusters) are a deliberately conservative starting point, not a claim
# that this makes Pick'em "live" -- re-tune only after confirming real
# backup-step duration in production, not just this repo's own local dev
# timing.
[functions."trigger-refresh-nfl-games-gameday-1"]
  schedule = "0 18 * * 0"

[functions."trigger-refresh-nfl-games-gameday-2"]
  schedule = "0 22 * * 0"

[functions."trigger-refresh-nfl-games-gameday-3"]
  schedule = "0 2 * * 1"

[functions."trigger-refresh-cfb-games-gameday-1"]
  schedule = "30 21 * * 6"

[functions."trigger-refresh-cfb-games-gameday-2"]
  schedule = "30 1 * * 0"

# Historical Engine Enrichment operation: draft_facts had no automatic
# refresh anywhere in this repo (confirmed by grep) and was capped at 2024.
# Fifth dataset, same 30-minutes-apart stagger as the four above, same
# global-concurrency-guard reasoning (see refresh_shared.js) -- draft picks
# change far less often than schedules/scores (once a year, in the spring),
# so daily is generous headroom, not a requirement.
[functions."trigger-refresh-nfl-draft"]
  schedule = "10 11 * * *"

# Historical Engine Enrichment operation, continuation: player_season_stats
# had zero rows before this -- sixth dataset, same 30-minutes-apart stagger.
[functions."trigger-refresh-nfl-player-stats"]
  schedule = "40 11 * * *"

# Master Knowledge Blueprint's top execution priority -- game-grain player
# stats, real canonical game_id linkage to `games`. Seventh dataset, same
# 30-minutes-apart stagger.
[functions."trigger-refresh-nfl-player-game-stats"]
  schedule = "10 12 * * *"

# Direct user request: real per-game team boxscores. Eighth dataset, same
# 30-minutes-apart stagger.
[functions."trigger-refresh-nfl-team-game-stats"]
  schedule = "40 12 * * *"

# Football Knowledge Expansion operation: extends cfb_player_season_stats_real
# from 2024-2025-only back to 2014, and keeps it current going forward.
# Ninth dataset, same 30-minutes-apart stagger.
[functions."trigger-refresh-cfb-player-stats"]
  schedule = "10 13 * * *"

# Engine-gap-audit operation: five more real datasets. Cadences follow the
# source pack's own explicit guidance (READS_ENGINE_MISSING_DATA_SOURCE_PACK's
# 00_READ_ME) rather than uniform daily -- contracts/PBP change slowly and
# are real backup/download/parse cost on this shared-CPU 1GB machine
# (gateway/fly.toml), so weekly is the honest right cadence, not daily for
# its own sake. Injuries genuinely change day to day in-season ("in-season
# frequent" per the source pack) so stay daily. All-America is 137 years of
# mostly-static history plus at most one new year per season -- monthly.

# Tenth dataset -- weekly (Sundays), same 30-minutes-apart stagger.
[functions."trigger-refresh-nfl-contracts"]
  schedule = "40 13 * * 0"

# Eleventh dataset -- daily, same 30-minutes-apart stagger.
[functions."trigger-refresh-nfl-injuries"]
  schedule = "10 14 * * *"

# Twelfth dataset -- weekly (Sundays), same 30-minutes-apart stagger.
[functions."trigger-refresh-nfl-pbp"]
  schedule = "40 14 * * 0"

# Thirteenth dataset -- daily, deliberately scheduled well after
# trigger-refresh-nfl-player-stats' own 11:40am slot (real dependency: this
# computes ratings FROM that dataset's real pass_interceptions column, so
# it must run after that data is fresh, not before).
[functions."trigger-refresh-nfl-passer-rating"]
  schedule = "10 15 * * *"

# Fourteenth dataset -- monthly (1st of each month).
[functions."trigger-refresh-cfb-all-america"]
  schedule = "40 15 1 * *"

# Engine-gap-audit operation, continuation: five more real CFB domains, all
# CFBD-key-dependent (tools/data_refresh/_cfbd_client.py). CFBD is a
# metered, PAID API (free tier: 1000 calls/month) -- unlike every other
# scheduled dataset in this file, which sources from free/unlimited
# nflverse or cfbfastR-data. Each of these five scripts defaults to a
# CURRENT-SEASON-ONLY refresh when called with no arguments (see each
# script's own target_seasons comment), so a weekly cadence here costs on
# the order of tens of real API calls a month total across all five, not
# hundreds -- the real 2002-2025 historical backfill already imported is
# never re-fetched by the schedule, only ever by an explicit manual
# `seasons=` call.

# Fifteenth dataset -- weekly (Sundays), same 30-minutes-apart stagger.
[functions."trigger-refresh-cfb-betting-lines"]
  schedule = "10 16 * * 0"

# Sixteenth dataset -- weekly (Sundays), same 30-minutes-apart stagger.
[functions."trigger-refresh-cfb-games-postseason"]
  schedule = "40 16 * * 0"

# Seventeenth dataset -- weekly (Sundays), same 30-minutes-apart stagger.
[functions."trigger-refresh-cfb-pbp"]
  schedule = "10 17 * * 0"

# Eighteenth dataset -- weekly (Sundays), same 30-minutes-apart stagger.
[functions."trigger-refresh-cfb-rankings"]
  schedule = "40 17 * * 0"

# Nineteenth dataset -- weekly (Sundays), same 30-minutes-apart stagger.
[functions."trigger-refresh-cfb-standings"]
  schedule = "10 18 * * 0"

# Twentieth dataset -- weather, unblocked only after a Patreon Tier 1+
# upgrade on the underlying CFBD API key (see cfb_weather_refresh.py's own
# module docstring). Same weekly (Sundays), 30-minutes-apart stagger and
# current-season-only default as its five CFBD siblings above.
[functions."trigger-refresh-cfb-weather"]
  schedule = "40 18 * * 0"
