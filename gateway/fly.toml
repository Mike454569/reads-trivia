# Reads Engine Gateway -- Fly.io production configuration.
#
# DEPLOYED AND LIVE as of the Production Integrity Fix Pass (2026-08-31).
# The comment block that used to sit here claimed this was still
# undeployed configuration-only ("no Fly.io account or app was created") --
# that was false at the time this pass found it: the real app
# (reads-football-gateway, region iad) and its 10GB volume
# (reads_engine_data) had existed for weeks. See PRODUCTION_STATUS.md at
# the repo root for the current, independently-verified state and how to
# re-verify it yourself -- treat any other file's "deployed"/"live"/
# "canary verified" claim as unconfirmed until you've checked it there or
# re-run the verification steps in that doc.
#
# v1.4 update: the v0.7-era framing below ("do not expose the Gateway to
# normal Reads users") is now STALE -- v1.2 explicitly authorized and built
# the public gameplay boundary (/v1/public/*) specifically so real Reads
# users CAN reach this Gateway, through a curated, no-admin-token surface.
# Admin routes (/v1/games/generate, /v1/grid/*, etc.) remain private via
# the bearer token regardless of network reachability -- that boundary was
# always token-based, never network-based, so nothing here needed to
# change for admin safety. The one thing that WOULD still matter if this
# Gateway were ever reachable by more than intended (e.g. a leaked internal
# hostname) is exactly what READS_PUBLIC_GAME_ENABLED (Part 10, below)
# exists for: an operator can take public gameplay down with one env var,
# with no code change and no redeploy.
#
# Real production app, created during the Final Go-Live Operation.
app = "reads-football-gateway"
primary_region = "iad"

[build]
  # Resolved relative to this config file's own directory (gateway/) by
  # `fly deploy --config gateway/fly.toml`, NOT relative to the build
  # context root -- "gateway/Dockerfile" here doubled to
  # gateway/gateway/Dockerfile and failed. The build CONTEXT is still the
  # repo root (the positional `.` passed to `fly deploy`), matching the
  # Dockerfile's own module docstring ("Build context is the REPO ROOT").
  dockerfile = "Dockerfile"

# --- internal port -----------------------------------------------------
# The Gateway itself speaks plain HTTP on 8850 inside Fly's private network
# (see gateway/Dockerfile's CMD). Fly's edge terminates TLS and forwards to
# this internal_port -- see READS_ENGINE_STAGING_V01_REPORT.md, Part I, for
# the full external-HTTPS / internal-HTTP architecture and why homemade TLS
# inside this Python process was deliberately not built.
[http_service]
  internal_port = 8850
  force_https = true  # Part 27: HTTPS is Fly's edge's job (TLS termination) -- this Gateway
                       # itself never speaks TLS (plain HTTP internally, see Dockerfile);
                       # force_https means Fly refuses to serve this app over plain HTTP
                       # at all, so reads.football -> Gateway traffic can never downgrade.
  auto_stop_machines = false   # stay up for real user traffic, not scale to zero
  auto_start_machines = true
  min_machines_running = 1
  # v1.4: the v0.7-era plan here was to additionally restrict this app at
  # the Fly network layer (private networking / IP allowlist) before any
  # real exposure -- superseded by v1.2's actual decision (see the header
  # comment above): public gameplay is now deliberately reachable, gated by
  # READS_PUBLIC_GAME_ENABLED / READS_PUBLIC_MODES + the public API's own
  # allow-list/rate-limit/CORS boundary, not by network-layer restriction.
  # (The old comment here cited READS_ENGINE_PUBLIC_EXPOSURE_GATE.md --
  # confirmed, again this phase, that file does not exist anywhere in this
  # repo; not re-citing it.)

  [[http_service.checks]]
    # Liveness -- matches gateway/Dockerfile's own HEALTHCHECK. Fly restarts
    # the machine if this fails repeatedly (Part K: platform-provided
    # supervision, not a custom one built here). Deliberately does NOT check
    # the Engine database -- an unmounted/still-initializing volume should
    # not cause Fly to repeatedly kill and restart an otherwise-healthy
    # process (see Dockerfile's HEALTHCHECK comment for the full reasoning).
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    protocol = "http"
    timeout = "5s"

  [[http_service.checks]]
    # v1.4, Part 5: readiness -- a SEPARATE check from liveness above,
    # added this phase (the v0.7 draft's Dockerfile comment always intended
    # this ("readiness... a job for /v1/ready via the platform's readiness
    # check, see fly.toml") but fly.toml itself never actually had it -- a
    # real gap found by re-reading both files together, not assumed).
    # Checks whether THIS instance can actually serve Engine-backed
    # gameplay (DB present/readable, mode registry loaded) -- Fly's proxy
    # should stop ROUTING traffic to a machine that fails this, without
    # necessarily killing/restarting the process the way a liveness
    # failure does (a missing volume mount is not fixed by a restart).
    #
    # Readiness-latency incident (post-go-live): real production testing
    # found `PRAGMA quick_check` against the 1.65GB database taking ~166s on
    # Fly's volume (vs ~10s locally). The original fix here was a 180s
    # timeout sized to tolerate that worst case -- but a readiness probe
    # that can independently take ~3 minutes is itself the problem: Fly
    # polled it faster than a cold check could finish and intermittently
    # marked the machine NOT READY (`context deadline exceeded`), capable of
    # pulling the only machine out of rotation.
    #
    # Real fix (tools/quiz_export/engine.py): `PRAGMA quick_check` is no
    # longer part of what `/v1/ready` checks at all -- readiness now only
    # verifies file-exists/DB-opens/one-real-lightweight-query-succeeds/
    # schema-marker-present, every one of which is small, indexed I/O, fast
    # even on this same slow volume (measured: sub-second, cold or warm).
    # Full structural integrity verification still happens -- once, at
    # process startup (gateway/app.py's lifespan handler, where a real ~166s
    # cost is genuinely acceptable) and on-demand via an admin-gated
    # diagnostic route -- just never on this polled hot path. timeout/
    # grace_period below are back down to short, honest values that would
    # actually catch a future regression instead of masking one.
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/v1/ready"
    protocol = "http"
    timeout = "10s"

# --- persistent volume (Part D) ------------------------------------------
# ONE volume, mounted at /data, holding BOTH the Football Warehouse (Engine
# .py modules + reads_football_v4.0.sqlite, see gateway/Dockerfile's module
# docstring for why they must live together) under /data/engine, AND the
# Gateway's own generated-package/game-state/log storage under
# /data/packages, /data/game_state, and /data/logs (matching
# READS_ENGINE_PACKAGES_DIR / READS_ENGINE_GAME_STATE_DIR /
# READS_ENGINE_LOG_DIR's defaults set as image ENV -- see gateway/Dockerfile).
# A real deploy must
# populate /data/engine (Engine code + database) onto this volume BEFORE
# first start -- the image itself intentionally ships without either (Part C).
[mounts]
  source = "reads_engine_data"
  destination = "/data"

[env]
  READS_ENGINE_DIR = "/data/engine"
  # READS_ENGINE_PACKAGES_DIR, READS_ENGINE_GAME_STATE_DIR, and
  # READS_ENGINE_LOG_DIR are already set as image-level ENV (/data/packages,
  # /data/game_state, /data/logs) in gateway/Dockerfile -- not repeated here
  # to avoid two sources of truth for the same value.
  # READS_ENGINE_ADMIN_TOKEN and READS_ENGINE_ALLOWED_ORIGINS are NOT set
  # here -- see the [secrets/config to set separately] note below. Never
  # put a real secret value in this file.
  #
  # v1.4 rollout controls (Part 10/11/34) -- safe, non-secret, deliberately
  # SET HERE (not left to code defaults) so the canary rollout stages in
  # READS_ENGINE_V14_IMPLEMENTATION_REPORT.md are literal `fly deploy`
  # config edits, not code changes.
  #
  # Final Go-Live Operation, Mission H: all five certified public modes
  # (draft_guess, championship_guess, lineup_guess, cfb_heisman_guess,
  # six_degrees_guess) verified end-to-end against this real production
  # Gateway -- real fetch, real wrong/correct answer validation, no
  # leakage. Server-side only: every frontend engine flag in
  # reads-config.js remains false, so no real reads.football visitor has
  # reached any of this yet -- see READS_FINAL_GO_LIVE_REPORT.md for why
  # frontend enablement is the one deliberately-held-back final step.
  #
  # Six Degrees (gateway/services/public_six_degrees.py) is a structurally
  # separate system from the Director-pipeline modes above and has its OWN
  # kill switch, READS_PUBLIC_SIX_DEGREES_ENABLED (defaults "true" in code
  # -- a real gap found during Mission G: it was reachable in production
  # even while READS_PUBLIC_GAME_ENABLED=false correctly blocked every
  # other mode, until this was set explicitly).
  READS_PUBLIC_GAME_ENABLED = "true"
  # App-Wide Engine Migration operation: nfl_game_result_guess/
  # cfb_game_result_guess added after real production verification (real
  # Super Bowl LX proof, real full-survey candidate counts) -- see
  # READS_APP_WIDE_ENGINE_MIGRATION_REPORT.md.
  # Creator stress test / discovery pass: this env var had drifted out of
  # sync with config.py's own PUBLIC_MODE_ALLOWLIST -- lineup_college_guess
  # was code-certified public (public-readiness punch-list) but silently
  # missing here, making it server-unavailable in production despite being
  # a real, working, already-built mode (found by directly querying
  # /v1/public/modes on production: it alone reported available=false).
  # Re-synced to match the code allowlist exactly, plus the 4 modes newly
  # certified this pass (real candidate surveys in gateway/services/
  # public_game.py's own PUBLIC_MODES entries).
  READS_PUBLIC_MODES = "draft_guess,championship_guess,lineup_guess,cfb_heisman_guess,nfl_game_result_guess,cfb_game_result_guess,nfl_game_boxscore_guess,lineup_college_guess,offense_college_guess,sb_champion_offense_college_guess,cfb_ranking_guess,cfb_upset_guess"
  READS_PUBLIC_SIX_DEGREES_ENABLED = "true"

# --- resource sizing (Part Q -- measured, not guessed; re-confirmed v1.4) --
# This milestone measured real Gateway process memory under load locally:
# ~39MB RSS at rest, ~46MB after a 25-question Draft/Championship
# generation, ~55MB peak after a 25-puzzle Player From Clues generation
# (the heaviest capability -- builds an in-memory model of all 4,506
# candidate players). Championship's generation was ALREADY part of this
# measurement (its internal capability predates v1.3's public exposure of
# it) -- v1.3/v1.4 didn't add a new, heavier code path, so this number is
# not stale despite predating Championship's public migration. SQLite's own
# page cache and the OS's file-system cache for the 1.65GB database are the
# dominant additional memory consumers beyond the Python process itself,
# and scale with how much of the database is actively queried, not with
# request volume. 1GB gives very generous headroom over the ~150-250MB
# realistic working set
# (process + a meaningfully warm page cache); it is deliberately NOT sized
# down to the bare-measured minimum, since a first staging deployment is
# exactly where you want margin for surprises, not a tight fit.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

