name: Shedeur Canonical Identity Lookup
on:
  push:
    branches: [story-cbs-prank-verification-v1]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read-only Shedeur ID lookup on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MACHINE=$(flyctl machines list -a reads-football-gateway --json | python3 -c 'import json,sys; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("state")=="started" and not str(x.get("name","")).startswith("ci-")),""))')
          test -n "$MACHINE"
          cat > /tmp/shedeur_ids.py <<'PY'
          import sqlite3,json
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True,timeout=6)
          c.row_factory=sqlite3.Row
          checks=[
          ("canonical_players","player_id","display_name"),
          ("canonical_cfb_players","cfb_player_id","display_name"),
          ("cfb_players","cfb_player_id","player_name"),
          ("nfl_players_draft","player_key","player_name"),
          ("player_profiles","player_id","display_name"),
          ("roster_seasons","player_key","player_name")
          ]
          for table,idcol,namecol in checks:
           try:
            rows=c.execute(f"SELECT {idcol} id,{namecol} name FROM {table} WHERE lower({namecol}) LIKE '%shedeur%' LIMIT 8").fetchall()
            print("PERSON_TABLE",table,json.dumps([dict(x) for x in rows]),flush=True)
           except Exception as e: print("QUERY_FAIL",table,str(e)[:140],flush=True)
          c.close()
          PY
          DATA=$(base64 -w0 /tmp/shedeur_ids.py)
          timeout 85s flyctl ssh console -a reads-football-gateway --machine "$MACHINE" -C "sh -lc 'echo $DATA | base64 -d >/tmp/shedeur_ids.py; timeout -k 3s 55s python -u /tmp/shedeur_ids.py'"
