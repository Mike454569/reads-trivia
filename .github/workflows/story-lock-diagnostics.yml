name: Story Question Copy Audit
on:
  push:
    branches: [story-question-copy-audit-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read question copy on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MACHINE=$(flyctl machines list -a reads-football-gateway --json | python3 -c 'import json,sys; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("state")=="started"),""))')
          cat >/tmp/copy_review.py <<'PY'
          import sqlite3,json
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True)
          c.row_factory=sqlite3.Row
          for r in c.execute("SELECT question_id,status,mechanic,question_json FROM story_generated_questions WHERE event_id='evt_story_a132d1da78e78935ddee627a'"):
           print("STORED_QUESTION",json.dumps(dict(r),ensure_ascii=False),flush=True)
          r=c.execute("SELECT title,neutral_summary,source_url FROM universal_event WHERE event_id='evt_story_a132d1da78e78935ddee627a'").fetchone()
          print("STORED_EVENT",json.dumps(dict(r) if r else None),flush=True)
          
          PY
          DATA=$(base64 -w0 /tmp/copy_review.py)
          timeout 80s flyctl ssh console -a reads-football-gateway --machine "$MACHINE" -C "sh -lc 'echo $DATA | base64 -d >/tmp/copy_review.py; python -u /tmp/copy_review.py'"
