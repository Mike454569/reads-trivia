name: Story CBS Extractor Verification
on:
  push:
    branches: [story-cbs-extractor-test-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify full patched extractor against CBS article on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c 'import json,sys; rows=json.load(sys.stdin); print(next((str(r.get("id")) for r in rows if str(r.get("state","")).lower()=="started" and not str(r.get("name","")).startswith("ci-")), ""))')
          test -n "$MACHINE"
          cat >/tmp/reads_cbs_extract.py <<'PY'
          import sqlite3,time,json
          from tools.director_v05.story_article_extract import fetch_article
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True,timeout=5)
          row=c.execute("SELECT source_url FROM football_story_candidates WHERE domain='nfl.com' AND source_url LIKE '%prank%' LIMIT 1").fetchone()
          c.close()
          assert row,"NFL candidate not present"
          t=time.monotonic()
          try:
           a=fetch_article(row[0],timeout=16)
           print("NFL_ARTICLE_RESULT",json.dumps({"status":"OK","text_chars":a.get("text_chars"),"headline":a.get("headline"),"domain":a.get("domain"),"seconds":round(time.monotonic()-t,2)}),flush=True)
           assert a["text_chars"]>=250
          except Exception as e:
           print("NFL_ARTICLE_FAILURE",repr(e),"seconds",round(time.monotonic()-t,2),flush=True)
           raise
          print("NFL_ARTICLE_PROBE_COMPLETED",flush=True)
          PY
          F_B64=$(base64 -w0 tools/director_v05/story_article_extract.py)
          P_B64=$(base64 -w0 /tmp/reads_cbs_extract.py)
          timeout 90s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'mkdir -p /tmp/reads_fetch_overlay/tools/director_v05; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/__init__.py; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/director_v05/__init__.py; echo $F_B64 | base64 -d >/tmp/reads_fetch_overlay/tools/director_v05/story_article_extract.py; echo $P_B64 | base64 -d >/tmp/reads_cbs_extract.py; cd /app; export PYTHONPATH=/tmp/reads_fetch_overlay:/app; timeout -k 5s 65s python -u /tmp/reads_cbs_extract.py'"
