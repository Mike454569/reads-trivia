name: Story Evidence Safety Regression
on:
  push:
    branches:
      - story-evidence-validation-v1
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check stricter story evidence and canonical identity rules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/director_v05/story_to_trivia_factory.py tools/director_v05/story_subject_match.py
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path("tools/director_v05/story_to_trivia_factory.py").read_text()
          tree=ast.parse(src)
          family_terms=next(ast.literal_eval(n.value) for n in tree.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id=="FAMILY_TERMS")
          func=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="_family_evidence")
          ns={"FAMILY_TERMS":family_terms}
          exec(compile(ast.Module(body=[func],type_ignores=[]),"<fixture>","exec"),ns)
          evidence=ns["_family_evidence"]
          def article(headline,body):
              return {"headline":headline,"description":"","text":body}
          assert evidence("PRESS_CONFERENCE",article("Player injury update","The coach said his injury will take weeks"))==[]
          assert evidence("PRESS_CONFERENCE",article("Coach speaks to reporters","The coach spoke to reporters about the game"))
          assert evidence("TRADE_ODDITY",article("Player traded","The team traded a defender"))==[]
          assert evidence("TRADE_ODDITY",article("Shocking trade","An unexpected trade surprised fans"))
          print("PASS: ordinary speech or trades cannot be mislabeled as family-defining events")
          msrc=Path("tools/director_v05/story_subject_match.py").read_text()
          mtree=ast.parse(msrc)
          mfunc=next(n for n in mtree.body if isinstance(n,ast.FunctionDef) and n.name=="primary_identity_match")
          im={}
          exec(compile(ast.Module(body=[mfunc],type_ignores=[]),"<fixture>","exec"),im)
          assert im["primary_identity_match"]([{"entity_type":"COACH","entity_id":"wrong","in_title":False,"in_text":True}]) is None
          assert im["primary_identity_match"]([{"entity_type":"NFL_PLAYER","entity_id":"correct","in_title":True,"in_text":True}])["entity_id"]=="correct"
          print("PASS: canonical name must appear in both sourced headline and article text")
          PY
