name: Draft Options Grounding Check
on:
  push:
    branches: [story-question-copy-audit-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify 2025 draft quarterback alternatives on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MACHINE=$(flyctl machines list -a reads-football-gateway --json | python3 -c 'import json,sys; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("state")=="started"),""))')
          cat >/tmp/draft_options.py <<'PY'
          import sqlite3,json
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True,timeout=5)
          c.row_factory=sqlite3.Row
          for table in ("draft_facts","canonical_players","nfl_players_draft"):
           print("SCHEMA",table,json.dumps([r["name"] for r in c.execute("PRAGMA table_info("+table+")")]),flush=True)
          for row in c.execute("""SELECT d.player_key,d.draft_season,d.draft_round,d.draft_pick_overall,d.verification_status,p.display_name
          FROM draft_facts d JOIN canonical_players p ON d.player_key=p.player_id
          WHERE d.draft_season=2025 AND lower(p.display_name) IN
          ('cam ward','jaxson dart','tyler shough','jalen milroe','dillon gabriel','quinn ewers','will howard','riley leonard')
          ORDER BY d.draft_pick_overall"""):
           print("QB_DRAFT",json.dumps(dict(row)),flush=True)
          c.close()
          PY
          DATA=$(base64 -w0 /tmp/draft_options.py)
          timeout 80s flyctl ssh console -a reads-football-gateway --machine "$MACHINE" -C "sh -lc 'echo $DATA | base64 -d >/tmp/draft_options.py; python -u /tmp/draft_options.py'"
