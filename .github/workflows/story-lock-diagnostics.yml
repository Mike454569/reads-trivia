name: Story Lock Diagnostics
on:
  push:
    branches:
      - "story-lock-diagnostic-trigger-*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-story-gdelt-rate-limits
      - name: Validate persistent CBS RSS GDELT fallback in memory
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/director_v05/story_candidate_harvest.py
          python - <<'PY'
          import ast, collections, datetime, hashlib, json, sqlite3, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path
          src=Path("tools/director_v05/story_candidate_harvest.py").read_text()
          tree=ast.parse(src)
          names={"_rss_story_family","_harvest_rss_on_throttle"}
          nodes=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in names]
          ns={"ET":ET,"urllib":urllib,"RSS_FALLBACK_FEEDS":(("NFL","https://www.cbssports.com/rss/headlines/nfl/"),),
              "RSS_STORY_TITLE_SIGNALS":{"TRADE_ODDITY":("trade",)},
              "_canonical_url":lambda x:x,"_domain":lambda x:urllib.parse.urlsplit(x).hostname.removeprefix("www."),
              "_candidate_id":lambda x:"id-"+hashlib.sha256(x.encode()).hexdigest()[:12],
              "_commit_with_retry":lambda c:c.commit()}
          rss=b"""<rss><channel><item><title>Unusual trade in NFL</title><link>https://www.cbssports.com/nfl/news/real-source</link></item><item><title>Normal weather forecast</title><link>https://www.cbssports.com/nfl/news/weather</link></item><item><title>Trade from unapproved host</title><link>https://example.com/trade</link></item></channel></rss>"""
          class FakeResponse:
              def __enter__(self):return self
              def __exit__(self,*a):pass
              def read(self,n):return rss
          ns["urllib"].request.urlopen=lambda req,timeout:FakeResponse()
          exec(compile(ast.Module(body=nodes,type_ignores=[]),"<extracted>","exec"),ns)
          c=sqlite3.connect(":memory:")
          c.execute("""CREATE TABLE football_story_candidates(
               candidate_id TEXT PRIMARY KEY,source_url TEXT UNIQUE,title TEXT,domain TEXT,
               seen_date TEXT,language TEXT,source_country TEXT,family_hint TEXT,
               query_text TEXT,evidence_tier_hint TEXT,sensitive_hint INT,status TEXT,
               first_harvested_at TEXT,last_seen_at TEXT)""")
          counts=collections.Counter()
          failures=[]
          inserted=ns["_harvest_rss_on_throttle"](c,now="2026-10-10T00:00:00Z",metrics=counts,failures=failures)
          assert inserted==1,(inserted,counts,failures)
          assert c.execute("SELECT status FROM football_story_candidates").fetchone()[0]=="REVIEW_REQUIRED"
          again=ns["_harvest_rss_on_throttle"](c,now="2026-10-10T00:00:00Z",metrics=counts,failures=failures)
          assert again==0,again
          print("PASS: syntactically valid; official-feed fallback stores review-only candidate, rejects weak/unapproved items, deduplicates")
          PY
