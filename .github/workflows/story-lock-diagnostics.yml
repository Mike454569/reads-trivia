name: Story Batch Lock Diagnostics
on:
  push:
    branches: [story-batch-timeout-fix-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect lock and story ledger with no DB writes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MACHINE=$(flyctl machines list -a reads-football-gateway --json | python3 -c 'import sys,json; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("state")=="started"),""))')
          test -n "$MACHINE"
          cat >/tmp/story_batch_diag.py <<'PY'
          import sqlite3,time,json,os
          p="/data/engine/reads_football_v4.0.sqlite"
          t=time.monotonic()
          c=sqlite3.connect("file:"+p+"?mode=ro",uri=True,timeout=3);c.row_factory=sqlite3.Row
          for k,sql in [
          ("candidate_states","SELECT status,COUNT(*) n FROM football_story_candidates GROUP BY status"),
          ("ledger_states","SELECT state,COUNT(*) n FROM story_candidate_processing GROUP BY state"),
          ("active","SELECT candidate_id,state,attempts,claimed_at,updated_at,last_error FROM story_candidate_processing WHERE state='PROCESSING' LIMIT 10"),
          ("recent","SELECT candidate_id,state,attempts,last_error FROM story_candidate_processing ORDER BY updated_at DESC LIMIT 8")
          ]:
           try: print("DIAG",k,json.dumps([dict(r) for r in c.execute(sql)]),flush=True)
           except Exception as e:print("DIAG_ERROR",k,str(e),flush=True)
          print("DIAG_ELAPSED",round(time.monotonic()-t,3),flush=True)
          c.close()
          PY
          P=$(base64 -w0 /tmp/story_batch_diag.py)
          timeout -k 5s 85s flyctl ssh console -a reads-football-gateway --machine "$MACHINE" -C "sh -lc 'echo ===LOCK===; flock -n /data/engine/story-volume-writer.lock true && echo LOCK_FREE || echo LOCK_BUSY; echo ===DATABASE===; echo $P | base64 -d >/tmp/story_batch_diag.py; timeout -k 4s 60s python -u /tmp/story_batch_diag.py'"
