name: NFL CFB Same-Player Link Audit
on:
  push:
    branches: [story-cbs-prank-verification-v1]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect explicit NFL and CFB Shedeur equivalence
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MACHINE=$(flyctl machines list -a reads-football-gateway --json | python3 -c 'import json,sys; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("state")=="started" and not str(x.get("name","")).startswith("ci-")),""))')
          test -n "$MACHINE"
          cat >/tmp/reads_nfl_cfb_links.py <<'PY'
          import sqlite3,json
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True,timeout=7);c.row_factory=sqlite3.Row
          for table,where in (
           ("nfl_cfb_player_links","lower(cfb_player_name) LIKE '%shedeur%' OR lower(nfl_player_name) LIKE '%shedeur%'"),
           ("nfl_cfb_player_links","cfb_player_id='ESPN_CFB:4432762' OR nfl_player_key='PFR:SandSh00'"),
          ):
           try:
            rows=c.execute(f"SELECT * FROM {table} WHERE {where} LIMIT 12").fetchall()
            print("LINKS",json.dumps([dict(r) for r in rows],default=str),flush=True)
           except Exception as e:print("ERROR",repr(e),flush=True)
          c.close()
          PY
          P_B64=$(base64 -w0 /tmp/reads_nfl_cfb_links.py)
          timeout 75s flyctl ssh console -a reads-football-gateway --machine "$MACHINE" -C "sh -lc 'echo $P_B64 | base64 -d > /tmp/reads_nfl_cfb_links.py; timeout -k 4s 45s python -u /tmp/reads_nfl_cfb_links.py'"
