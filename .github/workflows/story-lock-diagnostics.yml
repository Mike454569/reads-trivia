name: Story Multi-Publisher Bounded Fetch
on:
  push:
    branches: [story-article-fetch-test-v2]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Test bounded live publisher fetches on Fly without database writes
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c 'import json,sys; rows=json.load(sys.stdin); print(next((str(r.get("id")) for r in rows if str(r.get("state","")).lower()=="started" and not str(r.get("name","")).startswith("ci-")), ""))')
          test -n "$MACHINE"
          cat >/tmp/reads_multi_source.py <<'PY'
          import sqlite3,time,json
          from tools.director_v05.story_article_extract import fetch_article
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True,timeout=5)
          c.row_factory=sqlite3.Row
          rows=c.execute("""SELECT source_url,domain,title FROM football_story_candidates
          WHERE status='REVIEW_PRIORITY'
            AND domain IN ('nfl.com','cbssports.com','espn.com','foxsports.com')
          GROUP BY domain ORDER BY domain LIMIT 4""").fetchall()
          c.close()
          ok=0
          for row in rows:
           t=time.monotonic()
           try:
            a=fetch_article(row["source_url"],timeout=4)
            ok+=1
            outcome={"result":"ok","chars":a.get("text_chars")}
           except Exception as exc:
            outcome={"result":type(exc).__name__,"reason":str(exc)[:120]}
           elapsed=round(time.monotonic()-t,2)
           assert elapsed<12,(row["domain"],elapsed)
           print("SOURCE_CHECK",json.dumps({"domain":row["domain"],"duration_s":elapsed,**outcome}),flush=True)
          print("MULTISOURCE_CHECK_DONE",json.dumps({"attempted":len(rows),"fetched":ok}),flush=True)
          PY
          F_B64=$(base64 -w0 tools/director_v05/story_article_extract.py)
          P_B64=$(base64 -w0 /tmp/reads_multi_source.py)
          timeout 90s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'mkdir -p /tmp/reads_fetch_overlay/tools/director_v05; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/__init__.py; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/director_v05/__init__.py; echo $F_B64 | base64 -d >/tmp/reads_fetch_overlay/tools/director_v05/story_article_extract.py; echo $P_B64 | base64 -d >/tmp/reads_multi_source.py; cd /app; export PYTHONPATH=/tmp/reads_fetch_overlay:/app; timeout -k 5s 55s python -u /tmp/reads_multi_source.py'"
