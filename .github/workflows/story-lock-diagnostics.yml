name: Story Source Network Diagnostic
on:
  push:
    branches: [story-network-diagnostic-v1]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Compare public article response from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://www.nfl.com/news/son-of-falcons-dc-jeff-ulbrich-found-to-have-prank-called-shedeur-sanders-during-nfl-draft" "https://www.cbssports.com/nfl/" "https://www.espn.com/nfl/"; do
            curl -L -sS --connect-timeout 3 --max-time 8 --max-redirs 3 -A 'Mozilla/5.0' -o /tmp/story_probe.html -w "RUNNER domain=%{url_effective} code=%{http_code} bytes=%{size_download} ip=%{remote_ip} seconds=%{time_total}\\n" "$url" || true
          done
      - name: Compare Fly IPv4 network fetch and DNS
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c 'import json,sys; rows=json.load(sys.stdin); print(next((str(r.get("id")) for r in rows if str(r.get("state","")).lower()=="started" and not str(r.get("name","")).startswith("ci-")), ""))')
          test -n "$MACHINE"
          timeout 110s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo ===NETWORK===; for url in https://www.nfl.com/news/son-of-falcons-dc-jeff-ulbrich-found-to-have-prank-called-shedeur-sanders-during-nfl-draft https://www.cbssports.com/nfl/ https://www.espn.com/nfl/; do curl -4 -L -sS --connect-timeout 3 --max-time 8 --max-redirs 3 -A Mozilla/5.0 -o /tmp/story_probe.html -w \"FLY domain=%{url_effective} code=%{http_code} bytes=%{size_download} ip=%{remote_ip} seconds=%{time_total}\\n\" \"\$url\" || true; done'"
