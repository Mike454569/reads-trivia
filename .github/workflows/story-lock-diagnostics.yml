name: Story Article Fetch Deadline Validation
on:
  push:
    branches:
      - story-article-fetch-test-v1
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-story-volume-integrated-processing
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Syntax and deterministic child-timeout regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/director_v05/story_article_extract.py
          python - <<'PY'
          import subprocess
          from unittest import mock
          from tools.director_v05.story_article_extract import fetch_article
          with mock.patch("tools.director_v05.story_article_extract.subprocess.run",side_effect=subprocess.TimeoutExpired(["worker"],2)):
              try: fetch_article("https://www.nfl.com/news/example",timeout=2)
              except TimeoutError as e: assert "ARTICLE_TOTAL_FETCH_DEADLINE" in str(e)
              else: raise AssertionError("Didn't stop timed-out worker")
          with mock.patch("tools.director_v05.story_article_extract.subprocess.run") as run:
              run.return_value.returncode=0
              run.return_value.stdout='{"text":"example from article","headline":"test"}'
              result=fetch_article("https://www.nfl.com/news/example",timeout=2)
              assert result["text"]=="example from article"
              assert run.call_args.kwargs["timeout"]==3.0
          try: fetch_article("https://example.org/private")
          except ValueError as e: assert "ARTICLE_DOMAIN_NOT_APPROVED" in str(e)
          else: raise AssertionError("SSRF guard failed")
          print("PASS: timeout, subprocess results, and approved-domain guard")
          PY
      - name: Real Fly source request with process-enforced deadline (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          cat >/tmp/reads_fetch_probe.py <<'PY'
          import time, sqlite3
          from tools.director_v05.story_article_extract import fetch_article
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True)
          url=c.execute("SELECT source_url FROM football_story_candidates WHERE domain='nfl.com' AND title LIKE '%prank called Shedeur Sanders%' LIMIT 1").fetchone()
          c.close()
          assert url, "Real candidate missing"
          t=time.monotonic()
          try:
              article=fetch_article(url[0],timeout=4)
              print("FETCH_OK",article["text_chars"],flush=True)
          except Exception as exc:
              print("FETCH_BOUNDED_FAILURE",type(exc).__name__,str(exc)[:200],flush=True)
          elapsed=time.monotonic()-t
          print("FETCH_WALL_SECONDS",round(elapsed,2),flush=True)
          assert elapsed<11,f"fetch exceeded hard deadline: {elapsed}"
          print("PASS: real article retrieval returned or failed within its budget",flush=True)
          PY
          F_B64=$(base64 -w0 tools/director_v05/story_article_extract.py)
          P_B64=$(base64 -w0 /tmp/reads_fetch_probe.py)
          timeout 110s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'mkdir -p /tmp/reads_fetch_overlay/tools/director_v05; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/__init__.py; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/director_v05/__init__.py; echo $F_B64 | base64 -d >/tmp/reads_fetch_overlay/tools/director_v05/story_article_extract.py; echo $P_B64 | base64 -d >/tmp/reads_fetch_probe.py; cd /app; export PYTHONPATH=/tmp/reads_fetch_overlay:/app; timeout -k 5s 60s python -u /tmp/reads_fetch_probe.py'"
