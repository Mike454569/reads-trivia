name: Story Identity and Evidence Audit
on:
  push:
    branches:
      - "story-identity-evidence-test-v2"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Compile and enforce verified identity gates
        run: |
          set -euo pipefail
          python -m py_compile tools/director_v05/story_subject_match.py tools/director_v05/story_to_trivia_factory.py
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("sm","tools/director_v05/story_subject_match.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m.primary_identity_match([{"entity_type":"COACH","entity_id":"wrong","in_title":False,"in_text":True}]) is None
          assert m.primary_identity_match([{"entity_type":"NFL_PLAYER","entity_id":"right","in_title":True,"in_text":True}])["entity_id"]=="right"
          print("PASS: no background-only story identity promotion")
          PY
      - name: Read-only Fly preflight against verified source content
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          cat >/tmp/reads_identity_gate_preflight.py <<'PY'
          import importlib.util,sys,time,json
          from tools.quiz_export import engine as eng
          from tools.director_v05.story_article_extract import fetch_article
          def load(name,path):
           spec=importlib.util.spec_from_file_location(name,path)
           obj=importlib.util.module_from_spec(spec)
           sys.modules[name]=obj;spec.loader.exec_module(obj);return obj
          m=load("tools.director_v05.story_subject_match","/tmp/reads_story_subject_updated.py")
          factory=load("tools.director_v05.story_to_trivia_factory","/tmp/reads_story_factory_updated.py")
          c=eng.connect()
          start=time.monotonic()
          idx=m.build_subject_index(c)
          print("CANONICAL_LABELS",len(idx["labels"]),"INDEX_SECONDS",round(time.monotonic()-start,2),flush=True)
          rows=c.execute("""SELECT * FROM football_story_candidates WHERE status='REVIEW_PRIORITY'
          AND COALESCE(sensitive_hint,0)=0
          AND domain IN ('nfl.com','ncaa.org','espn.com','cbssports.com','foxsports.com','si.com','sports.yahoo.com','usatoday.com')
          AND family_hint IN ('COMEBACK_RETURN','TRADE_ODDITY','BIZARRE_MOMENT','OFF_FIELD_ODDITY','PRESS_CONFERENCE','DRAFT_CHAOS','TRADE_CHAOS','GAME_ODDITY')
          ORDER BY CASE family_hint WHEN 'COMEBACK_RETURN' THEN 0 WHEN 'TRADE_ODDITY' THEN 1 ELSE 2 END,first_harvested_at DESC
          LIMIT 45""").fetchall()
          c.close()
          stats={"retrieved":len(rows),"fetched":0,"old_subject":0,"new_subject":0,"pass_evidence":0,"high_confidence":0,"event_eligible":0}
          for row in rows[:32]:
           try:a=fetch_article(row["source_url"],timeout=8)
           except Exception as e:continue
           stats["fetched"]+=1
           old=m.primary_identity_match(m.match_subjects(idx,title=a.get("headline") or row["title"],text=a["text"]))
           combined=" ".join(dict.fromkeys(str(x).strip() for x in (row["title"],a.get("headline")) if str(x or "").strip()))
           new=m.primary_identity_match(m.match_subjects(idx,title=combined,text=a["text"]))
           if old:stats["old_subject"]+=1
           if new:stats["new_subject"]+=1
           if new:
            terms=factory._family_evidence(row["family_hint"],a)
            if terms:
             stats["pass_evidence"]+=1
             conf=factory._confidence(row,a,new,terms)
             threshold=factory.MIN_PRIMARY_SCORE if row["domain"] in factory.PRIMARY_DOMAINS else factory.MIN_REPUTABLE_SCORE
             if conf>=threshold:
              stats["high_confidence"]+=1
              try:
               event=factory._build_event(row,a,new,terms)
               stats["event_eligible"]+=1
               print("ELIGIBLE_EVENT",json.dumps({"id":row["candidate_id"],"name":new["label"],"family":row["family_hint"],"confidence":conf,"source":row["source_url"]}),flush=True)
              except ValueError:pass
           if new and not old:
            print("MATCH_RECOVERED",json.dumps({"id":row["candidate_id"],"name":new["label"],"family":row["family_hint"]}),flush=True)
          print("GATED_COVERAGE",json.dumps(stats,sort_keys=True),flush=True)
          print("READONLY_REVIEW_COMPLETE",flush=True)
          PY
          M_B64=$(base64 -w0 tools/director_v05/story_subject_match.py)
          F_B64=$(base64 -w0 tools/director_v05/story_to_trivia_factory.py)
          P_B64=$(base64 -w0 /tmp/reads_identity_gate_preflight.py)
          timeout 200s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo $M_B64 | base64 -d >/tmp/reads_story_subject_updated.py; echo $F_B64 | base64 -d >/tmp/reads_story_factory_updated.py; echo $P_B64 | base64 -d >/tmp/reads_identity_gate_preflight.py; cd /app; export PYTHONPATH=/app; export READS_ENGINE_DIR=/data/engine; timeout -k 4s 155s python -u /tmp/reads_identity_gate_preflight.py'"
