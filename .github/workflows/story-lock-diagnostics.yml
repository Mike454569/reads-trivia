name: Story Final Database Safety Check
on:
  push:
    branches:
      - "story-integration-test-v2"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Final story lock and verified-question counts (read only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          cat >/tmp/reads_final_counts.py <<'PY'
          import sqlite3,json,os
          p="/data/engine/reads_football_v4.0.sqlite"
          c=sqlite3.connect("file:"+p+"?mode=ro",uri=True,timeout=5)
          counts={
           "candidates":c.execute("SELECT COUNT(*) FROM football_story_candidates").fetchone()[0],
           "verified_story_events":c.execute("SELECT COUNT(DISTINCT e.promoted_event_id) FROM football_story_enrichment e JOIN universal_event u ON u.event_id=e.promoted_event_id WHERE e.decision='AUTO_PROMOTED' AND u.verification_status='VERIFIED'").fetchone()[0],
           "playable_questions":c.execute("SELECT COUNT(*) FROM story_generated_questions WHERE status IN ('READY_FOR_BANK','READY_FOR_FORMAT_BANK')").fetchone()[0],
          }
          c.close()
          print("FINAL_READONLY_STORY_TOTALS",json.dumps(counts,sort_keys=True),flush=True)
          PY
          P_B64=$(base64 -w0 /tmp/reads_final_counts.py)
          timeout 95s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo $P_B64 | base64 -d >/tmp/reads_final_counts.py; echo ===STORY_WRITER_LOCK===; flock -n /data/engine/story-volume-writer.lock true && echo LOCK_FREE || echo LOCK_BUSY; timeout -k 4s 35s python -u /tmp/reads_final_counts.py'"
