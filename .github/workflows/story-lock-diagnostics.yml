name: Story Process Lock Inspection
on:
  push:
    branches:
      - "story-integration-test-v2"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read-only Fly process and lock ownership inspection
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          timeout 90s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo ===PID4011===; od -An -c /proc/4011/cmdline | head -12; cat /proc/4011/status | head -12; echo ===PID4012===; od -An -c /proc/4012/cmdline | head -15; cat /proc/4012/status | head -12; echo ===PID3999===; od -An -c /proc/3999/cmdline | head -12; cat /proc/3999/status | head -10'"
