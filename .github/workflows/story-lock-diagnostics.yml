name: Story One-Event Verification Probe
on:
  push:
    branches:
      - "story-integration-test-v3"
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-story-volume-integrated-processing
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: One evidence-gated candidate to playable question
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          cat >/tmp/reads_one_event_probe.py <<'PY'
          import importlib.util,sys,time,json
          from tools.quiz_export import engine as eng
          from tools.director_v05.story_article_extract import fetch_article as read_article
          from tools.director_v05.story_sqlite import prepare_write_connection
          def load(name,path):
           spec=importlib.util.spec_from_file_location(name,path)
           obj=importlib.util.module_from_spec(spec)
           sys.modules[name]=obj
           spec.loader.exec_module(obj)
           return obj
          matcher=load("tools.director_v05.story_subject_match","/tmp/reads_match_v3.py")
          factory=load("tools.director_v05.story_to_trivia_factory","/tmp/reads_factory_v3.py")
          c=prepare_write_connection(eng.connect())
          def counts():
           return {
           "verified_stories":c.execute("SELECT COUNT(DISTINCT e.promoted_event_id) FROM football_story_enrichment e JOIN universal_event u ON u.event_id=e.promoted_event_id WHERE e.decision='AUTO_PROMOTED' AND u.verification_status='VERIFIED'").fetchone()[0],
           "playable_questions":c.execute("SELECT COUNT(*) FROM story_generated_questions WHERE status IN ('READY_FOR_BANK','READY_FOR_FORMAT_BANK')").fetchone()[0]
           }
          before=counts()
          print("BEFORE",json.dumps(before),flush=True)
          start=time.monotonic()
          idx=matcher.build_subject_index(c)
          print("INDEX_READY",len(idx["labels"]),"SECONDS",round(time.monotonic()-start,2),flush=True)
          rows=c.execute("""SELECT * FROM (
          SELECT *, ROW_NUMBER() OVER (
            PARTITION BY family_hint
            ORDER BY CASE WHEN domain IN ('nfl.com','ncaa.org') THEN 0 ELSE 1 END,
                     first_harvested_at DESC, candidate_id
          ) AS family_rank
          FROM football_story_candidates
          WHERE status='REVIEW_PRIORITY'
          AND COALESCE(sensitive_hint,0)=0
          AND domain IN ('nfl.com','ncaa.org','espn.com','cbssports.com','foxsports.com','si.com','sports.yahoo.com','usatoday.com')
          AND family_hint IN ('OFF_FIELD_ODDITY','COMEBACK_RETURN','TRADE_ODDITY','BIZARRE_MOMENT','PRESS_CONFERENCE','DRAFT_CHAOS','TRADE_CHAOS','GAME_ODDITY','COACHING_ODDITY','RIVALRY_ODDITY','CELEBRATION_FAN','BUST_REDEMPTION')
          ) WHERE family_rank<=9
          ORDER BY family_rank, family_hint
          LIMIT 100""").fetchall()
          print("PREFLIGHT_POOL",len(rows),flush=True)
          selected=None
          for row in rows[:70]:
           family=row["family_hint"]
           if family not in factory.AUTO_FAMILIES:continue
           t=time.monotonic()
           try: article=read_article(row["source_url"],timeout=8)
           except Exception as exc:
            print("SKIP_FETCH",row["candidate_id"],type(exc).__name__,str(exc)[:95],flush=True)
            continue
           matches=matcher.match_subjects(idx,title=article.get("headline") or row["title"],text=article["text"])
           person=matcher.primary_identity_match(matches)
           hits=factory._family_evidence(family,article)
           conf=factory._confidence(row,article,person,hits) if person and hits else 0
           required=factory.MIN_PRIMARY_SCORE if row["domain"] in factory.PRIMARY_DOMAINS else factory.MIN_REPUTABLE_SCORE
           print("PREFLIGHT",row["candidate_id"],"FAMILY",family,"PERSON",person["label"] if person else None,"HITS",len(hits),"CONF",conf,"THRESHOLD",required,"SECONDS",round(time.monotonic()-t,2),flush=True)
           if person and hits and conf>=required:
            try:factory._build_event(row,article,person,hits)
            except ValueError as exc:
             print("SKIP_EVENT",str(exc),flush=True)
             continue
            selected=(row,article)
            break
          if selected is None:
           print("NO_ELIGIBLE_PROMOTION_IN_70; zero automatic promotions",flush=True)
           print("AFTER",json.dumps(counts()),flush=True)
           c.close()
           raise SystemExit(0)
          row,article=selected
          print("SELECTED",row["candidate_id"],row["title"][:110],flush=True)
          factory.fetch_article=lambda url:article
          t=time.monotonic()
          result=factory.process_candidate(c,row,idx,include_deep_chains=False)
          print("PROCESS_RESULT",json.dumps(result,default=str,sort_keys=True),flush=True)
          after=counts()
          print("AFTER",json.dumps(after),flush=True)
          print("DELTA",json.dumps({k:after[k]-before[k] for k in before}),"SECONDS",round(time.monotonic()-t,2),flush=True)
          c.close()
          print("ONE_CANDIDATE_FINISHED",flush=True)
          PY
          M_B64=$(base64 -w0 tools/director_v05/story_subject_match.py)
          F_B64=$(base64 -w0 tools/director_v05/story_to_trivia_factory.py)
          P_B64=$(base64 -w0 /tmp/reads_one_event_probe.py)
          timeout --signal=TERM 225s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo $M_B64 | base64 -d >/tmp/reads_match_v3.py; echo $F_B64 | base64 -d >/tmp/reads_factory_v3.py; echo $P_B64 | base64 -d >/tmp/reads_one_event_probe.py; cd /app; export PYTHONPATH=/app; export READS_ENGINE_DIR=/data/engine; flock -w 10 /data/engine/story-volume-writer.lock timeout -k 5s 190s python -u /tmp/reads_one_event_probe.py'"
