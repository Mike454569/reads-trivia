name: Story Event Selection Regression
on:
  push:
    branches:
      - "story-event-selection-test-v1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-story-volume-integrated-processing
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run synthetic family and evidence selection tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/director_v05/story_to_trivia_factory.py
          python - <<'PY'
          import ast,sqlite3,re
          from collections import Counter
          from pathlib import Path
          src=Path("tools/director_v05/story_to_trivia_factory.py").read_text()
          tree=ast.parse(src)
          wanted={"_story_candidate_priority","_select_event_rich_candidates"}
          nodes=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in wanted]
          constants={"EVENT_DISCOVERY_HEADLINES","DISCOVERY_LOW_SIGNAL","AUTO_FAMILIES","PRIMARY_DOMAINS"}
          nodes=[n for n in tree.body if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and n.targets[0].id in constants]+nodes
          ns={"re":re,"Counter":Counter}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),"<fixture>","exec"),ns)
          c=sqlite3.connect(":memory:")
          c.row_factory=sqlite3.Row
          c.execute("CREATE TABLE football_story_candidates(candidate_id TEXT,status TEXT,source_url TEXT,domain TEXT,title TEXT,family_hint TEXT,sensitive_hint INTEGER,first_harvested_at TEXT)")
          rows=[
           ("one","REVIEW_PRIORITY","https://nfl.com/a","nfl.com","Coach speaks to reporters after major win","PRESS_CONFERENCE",0,"2026"),
           ("two","REVIEW_PRIORITY","https://nfl.com/b","nfl.com","Jayden Daniels weekly injury update","PRESS_CONFERENCE",0,"2026"),
           ("three","REVIEW_PRIORITY","https://nfl.com/c","nfl.com","Unexpected trade stuns the NFL","TRADE_ODDITY",0,"2026"),
           ("four","REVIEW_PRIORITY","https://nfl.com/d","nfl.com","Player arrest shocks teammates","DISCIPLINE_LEGAL",1,"2026"),
           ("five","REVIEW_REQUIRED","https://nfl.com/e","nfl.com","Bizarre play stuns fans","BIZARRE_MOMENT",0,"2026"),
           ("six","REVIEW_PRIORITY","https://nfl.com/f","nfl.com","Fantasy football power rankings","BIZARRE_MOMENT",0,"2026"),
          ]
          c.executemany("INSERT INTO football_story_candidates VALUES (?,?,?,?,?,?,?,?)",rows)
          found=ns["_select_event_rich_candidates"](c,limit=10)
          assert {x["candidate_id"] for x in found}=={"one","three"},found
          print("PASS: high-signal candidates selected; injury, legal, unreviewed and irrelevant headlines excluded")
          PY
      - name: Read-only Fly candidate selection audit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          cat >/tmp/story_select_audit.py <<'PY'
          import importlib.util,sys,json,time
          from tools.quiz_export import engine as eng
          spec=importlib.util.spec_from_file_location("tools.director_v05.story_to_trivia_factory","/tmp/story_factory_event_selection.py")
          fac=importlib.util.module_from_spec(spec);sys.modules[spec.name]=fac;spec.loader.exec_module(fac)
          c=eng.connect()
          t=time.monotonic()
          rows=fac._select_event_rich_candidates(c,limit=12,scan_limit=5000)
          print("EVENT_CANDIDATES_SELECTED",len(rows),"SECONDS",round(time.monotonic()-t,3),flush=True)
          from tools.director_v05.story_article_extract import fetch_article
          from tools.director_v05.story_subject_match import build_subject_index,match_subjects,primary_identity_match
          index=build_subject_index(c)
          stats={"selected":len(rows),"fetched":0,"canonical_person":0,"category_evidence":0,"linked_passage":0,"meets_confidence":0,"event_constructible":0}
          for row in rows:
           print("SELECTED",json.dumps({"family":row["family_hint"],"title":row["title"][:95],"domain":row["domain"]}),flush=True)
           try:
            article=fetch_article(row["source_url"],timeout=9)
           except Exception as exc:
            print("FETCH_HELD",row["candidate_id"],type(exc).__name__,str(exc)[:100],flush=True)
            continue
           stats["fetched"]+=1
           combined=" ".join(dict.fromkeys(str(x).strip() for x in (row["title"],article.get("headline")) if str(x or "").strip()))
           subject=primary_identity_match(match_subjects(index,title=combined,text=article["text"]))
           if subject is None:
            print("IDENTITY_HELD",row["candidate_id"],flush=True)
            continue
           stats["canonical_person"]+=1
           family=row["family_hint"]
           terms=fac._family_evidence(family,article)
           if not terms:
            print("CATEGORY_HELD",row["candidate_id"],flush=True)
            continue
           stats["category_evidence"]+=1
           passage=fac._event_evidence(article,subject,family)
           if not passage:
            print("PASSAGE_HELD",row["candidate_id"],flush=True)
            continue
           stats["linked_passage"]+=1
           score=fac._confidence(row,article,subject,terms)
           threshold=fac.MIN_PRIMARY_SCORE if row["domain"] in fac.PRIMARY_DOMAINS else fac.MIN_REPUTABLE_SCORE
           if score<threshold:
            print("CONFIDENCE_HELD",row["candidate_id"],score,threshold,flush=True)
            continue
           stats["meets_confidence"]+=1
           try:
            event=fac._build_event(row,article,subject,terms)
           except ValueError as exc:
            print("EVENT_HELD",row["candidate_id"],str(exc),flush=True)
            continue
           stats["event_constructible"]+=1
           print("EVENT_PREFLIGHT_OK",json.dumps({"id":row["candidate_id"],"subject":subject["label"],"family":family,"url":row["source_url"],"passage_sha256":passage["passage_sha256"]}),flush=True)
          print("SOURCE_PREFLIGHT_COUNTS",json.dumps(stats,sort_keys=True),flush=True)
          print("LIVE_QUEUE_READONLY_COMPLETE",flush=True)
          PY
          F_B64=$(base64 -w0 tools/director_v05/story_to_trivia_factory.py)
          P_B64=$(base64 -w0 /tmp/story_select_audit.py)
          timeout 120s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo $F_B64 | base64 -d >/tmp/story_factory_event_selection.py; echo $P_B64 | base64 -d >/tmp/story_select_audit.py; cd /app; export PYTHONPATH=/app; export READS_ENGINE_DIR=/data/engine; timeout -k 5s 85s python -u /tmp/story_select_audit.py'"
