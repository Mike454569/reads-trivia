name: Story Lock Diagnostics
on:
  push:
    branches:
      - "story-lock-diagnostic-trigger-*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-story-gdelt-rate-limits
      - name: Check syntax and GDELT 429 response classification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/director_v05/story_candidate_harvest.py
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p=Path("tools/director_v05/story_candidate_harvest.py")
          module=ast.parse(p.read_text())
          wanted={"GDELTThrottleError","GDELTResponseError","_decode_gdelt_response","_pace_gdelt_request"}
          nodes=[node for node in module.body if isinstance(node,(ast.ClassDef,ast.FunctionDef)) and node.name in wanted]
          ns={"json":json}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),str(p),"exec"),ns)
          obj=ns["_decode_gdelt_response"](b'{"articles":[{"url":"https://nfl.com/example"}]}',http_status=200)
          assert len(obj["articles"])==1
          for status,body in [(429,b"Please limit requests to one every 5 seconds"),(200,b"Please limit requests to one every 5 seconds")]:
              try: ns["_decode_gdelt_response"](body,http_status=status)
              except ns["GDELTThrottleError"]: pass
              else: raise AssertionError(f"Failed to detect throttle HTTP {status}")
          try: ns["_decode_gdelt_response"](b"<html>error</html>",http_status=200)
          except ns["GDELTResponseError"]: pass
          else: raise AssertionError("Invalid HTML classified as success")
          print("PASS: syntax, valid response, 429, 200-throttle, malformed HTML")
          PY
