name: Story Process Lock Inspection
on:
  push:
    branches:
      - "story-integration-test-v2"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read-only Fly process and lock ownership inspection
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          timeout 90s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo ===LOCK_PROBE===; flock -n /data/engine/story-volume-writer.lock true && echo LOCK_FREE || echo LOCK_BUSY; echo ===LOCK_INODE===; stat -c %i /data/engine/story-volume-writer.lock || true; echo ===PROC_LOCKS===; cat /proc/locks | head -75 || true; echo ===LOCK_FD_OWNERS===; ls -l /proc/[0-9]*/fd/* 2>/dev/null | grep story-volume-writer.lock | head -50 || true; echo ===PROCESSES===; for p in /proc/[0-9]*; do name=\$(cat \$p/comm 2>/dev/null || true); case \$name in python*|flock|sh|gunicorn|uvicorn) echo \$p \$name \$(tr \\0 " " < \$p/cmdline 2>/dev/null | cut -c1-250);; esac; done | head -100'"
