name: Story Canonical Identity Gap Audit
on:
  push:
    branches:
      - "story-identity-evidence-test-v1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-story-volume-integrated-processing
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Regression test fail-closed identity policy
        run: |
          set -euo pipefail
          python -m py_compile tools/director_v05/story_subject_match.py
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("match","tools/director_v05/story_subject_match.py")
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          background=[{"entity_type":"COACH","entity_id":"nag","label":"Matt Nagy","in_title":False,"in_text":True}]
          assert m.primary_identity_match(background) is None
          title={"entity_type":"NFL_PLAYER","entity_id":"jay","label":"Jayden Daniels","in_title":True,"in_text":True}
          assert m.primary_identity_match(background+[title])["entity_id"]=="jay"
          assert m.primary_identity_match([title,{**title,"label":"Jayden E. Daniels"}])["entity_id"]=="jay"
          assert m.primary_identity_match([title,{**title,"entity_id":"other"}]) is None
          print("PASS: no background-person auto-promotion; aliases collapse; ambiguous titles held")
          PY
      - name: Find missing canonical identity sources read-only on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APP=reads-football-gateway
          MACHINES=$(flyctl machines list -a "$APP" --json)
          MACHINE=$(printf '%s' "$MACHINES" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          cat >/tmp/reads_identity_db_audit.py <<'PY'
          import sqlite3,json
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True,timeout=5)
          for t in ("roster_seasons","player_profiles","nfl_players_draft","entity_aliases","nfl_cfb_player_links","nfl_player_background","cfb_players","coaches","cfb_coaches","canonical_players","canonical_cfb_players","staging_rosters"):
           try:
            cols=[x[1] for x in c.execute("PRAGMA table_info("+t+")")]
            print("SCHEMA",t,json.dumps(cols[:30]),flush=True)
            names=[x for x in cols if "name" in x.lower() or "alias" in x.lower()]
            for col in names[:2]:
             q=f"SELECT {col} FROM {t} WHERE lower({col}) LIKE '%jayden daniels%' LIMIT 2"
             hits=c.execute(q).fetchall()
             if hits:print("JAYDEN_FOUND",t,col,json.dumps(hits),flush=True)
           except Exception as e:print("ERROR",t,str(e)[:80],flush=True)
          c.close()
          PY
          P_B64=$(base64 -w0 /tmp/reads_identity_db_audit.py)
          timeout 105s flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo $P_B64 | base64 -d >/tmp/reads_identity_db_audit.py; timeout -k 5s 75s python -u /tmp/reads_identity_db_audit.py'"
