name: Story Smoke Lock and Ledger Inspection
on:
  push:
    branches: [story-volume-postmortem-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check Fly lock and batch ledger read-only
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          MACHINE=$(flyctl machines list -a reads-football-gateway --json | python3 -c 'import json,sys; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("state")=="started"),""))')
          test -n "$MACHINE"
          cat >/tmp/story_ledger_probe.py <<'PY'
          import sqlite3,json
          c=sqlite3.connect("file:/data/engine/reads_football_v4.0.sqlite?mode=ro",uri=True,timeout=5);c.row_factory=sqlite3.Row
          print("PROCESSING_STATES",json.dumps([dict(r) for r in c.execute("SELECT state,COUNT(*) count FROM story_candidate_processing GROUP BY state")]),flush=True)
          print("RECENT_PROCESSING",json.dumps([dict(r) for r in c.execute("SELECT candidate_id,state,attempts,substr(last_error,1,130) last_error,updated_at FROM story_candidate_processing WHERE state='PROCESSING' ORDER BY updated_at DESC LIMIT 6")]),flush=True)
          print("DB_READ_OK",flush=True)
          c.close()
          PY
          PAYLOAD=$(base64 -w0 /tmp/story_ledger_probe.py)
          timeout 95s flyctl ssh console -a reads-football-gateway --machine "$MACHINE" -C "sh -lc 'echo ===WRITER_LOCK===; flock -n /data/engine/story-volume-writer.lock true && echo LOCK_FREE || echo LOCK_BUSY; echo $PAYLOAD | base64 -d >/tmp/story_ledger_probe.py; timeout -k 4s 60s python -u /tmp/story_ledger_probe.py'"
