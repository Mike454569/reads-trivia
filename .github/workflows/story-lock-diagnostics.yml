name: CBS Verified Subject and Article
on:
  push:
    branches: [story-cbs-prank-verification-v1]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-story-volume-integrated-processing
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Compile scoped identity fix
        run: |
          python -m py_compile tools/director_v05/story_subject_match.py tools/director_v05/story_to_trivia_factory.py tools/director_v05/story_article_extract.py
      - name: Recheck real CBS article and Shedeur's NFL canonical ID on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MACHINE=$(flyctl machines list -a reads-football-gateway --json | python3 -c 'import json,sys; print(next((str(x["id"]) for x in json.load(sys.stdin) if x.get("state")=="started" and not str(x.get("name","")).startswith("ci-")),""))')
          test -n "$MACHINE"
          cat >/tmp/reads_verify_shedeur.py <<'PY'
          import importlib.util,sys,time,json
          from tools.quiz_export import engine as eng
          from tools.director_v05.story_article_extract import fetch_article
          def load(name,path):
           sp=importlib.util.spec_from_file_location(name,path)
           m=importlib.util.module_from_spec(sp);sys.modules[name]=m;sp.loader.exec_module(m);return m
          sm=load("tools.director_v05.story_subject_match","/tmp/reads_cbs_subject.py")
          fac=load("tools.director_v05.story_to_trivia_factory","/tmp/reads_cbs_factory.py")
          source="https://www.cbssports.com/nfl/news/shedeur-sanders-prank-call-son-of-nfl-defensive-coordinator-at-center-of-stunt-pulled-during-draft-weekend/"
          article=fetch_article(source,timeout=13)
          print("ARTICLE_OK",article["text_chars"],flush=True)
          c=eng.connect()
          idx=sm.build_subject_index(c)
          c.close()
          title="Shedeur Sanders prank call: Son of NFL defensive coordinator at center of stunt pulled during draft weekend"
          matches=sm.match_subjects(idx,title=title+" "+article["headline"],text=article["text"],league_hint="NFL",max_matches=12)
          subject=sm.primary_identity_match(matches)
          terms=fac._family_evidence("OFF_FIELD_ODDITY",article)
          passage=fac._event_evidence(article,subject,"OFF_FIELD_ODDITY") if subject else None
          print("MATCHED_SUBJECT",json.dumps(subject,default=str),flush=True)
          print("FAMILY_AND_PASSAGE",json.dumps({"terms":terms,"linked_passage":bool(passage)},default=str),flush=True)
          assert subject and subject["entity_type"]=="NFL_PLAYER" and subject["label"]=="Shedeur Sanders"
          print("PASS: NFL-scoped same-name identity resolution on real CBS article",flush=True)
          PY
          A_B64=$(base64 -w0 tools/director_v05/story_article_extract.py)
          S_B64=$(base64 -w0 tools/director_v05/story_subject_match.py)
          F_B64=$(base64 -w0 tools/director_v05/story_to_trivia_factory.py)
          P_B64=$(base64 -w0 /tmp/reads_verify_shedeur.py)
          timeout 140s flyctl ssh console -a reads-football-gateway --machine "$MACHINE" -C "sh -lc 'mkdir -p /tmp/reads_fetch_overlay/tools/director_v05; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/__init__.py; printf \"from pkgutil import extend_path; __path__ = extend_path(__path__, __name__)\\n\" >/tmp/reads_fetch_overlay/tools/director_v05/__init__.py; echo $A_B64 | base64 -d >/tmp/reads_fetch_overlay/tools/director_v05/story_article_extract.py; echo $S_B64 | base64 -d >/tmp/reads_cbs_subject.py; echo $F_B64 | base64 -d >/tmp/reads_cbs_factory.py; echo $P_B64 | base64 -d >/tmp/reads_verify_shedeur.py; cd /app; export PYTHONPATH=/tmp/reads_fetch_overlay:/app; export READS_ENGINE_DIR=/data/engine; timeout -k 4s 115s python -u /tmp/reads_verify_shedeur.py'"
