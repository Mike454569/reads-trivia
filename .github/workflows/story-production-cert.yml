name: Story Production Certification

on:
  pull_request:
    branches:
      - main

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly access
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl status -a reads-football-gateway

      - name: Package current source
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github --exclude='*.sqlite' --exclude='*.sqlite-*' -czf /tmp/reads-story-cert.tgz .

      - name: Upload current source to temporary Fly path
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl sftp put /tmp/reads-story-cert.tgz /tmp/reads-story-cert.tgz -a reads-football-gateway

      - name: Run read-only Story Factory production certification
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console -a reads-football-gateway -C "sh -lc 'rm -rf /tmp/reads-story-cert && mkdir -p /tmp/reads-story-cert && tar -xzf /tmp/reads-story-cert.tgz -C /tmp/reads-story-cert && cd /tmp/reads-story-cert && export PYTHONPATH=/tmp/reads-story-cert && export READS_ENGINE_DIR=/data/engine && echo STORY_QUESTION_QUALITY_BEGIN && python3 -m tools.director_v05.certify_story_question_quality && echo STORY_QUESTION_QUALITY_END && echo STORY_GAME_REACH_BEGIN && python3 -m tools.director_v05.certify_story_game_reach && echo STORY_GAME_REACH_END'"
