name: Story Production Certification

on:
  push:
    branches:
      - 'story-prod-cert-trigger-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Certify live Story Factory DB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve live Fly machine
        id: flymachine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          test -n "${FLY_API_TOKEN:-}"
          flyctl status -a "$APP"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          echo "machine=$MACHINE" >> "$GITHUB_OUTPUT"
          echo "Resolved live machine: $MACHINE"

      - name: Verify production DB over retrying SSH
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE="${{ steps.flymachine.outputs.machine }}"
          DB_SIZE=""
          for attempt in 1 2 3 4 5 6; do
            DB_SIZE=$(flyctl ssh console -a "$APP" --machine "$MACHINE" -C 'sh -lc "stat -c %s /data/engine/reads_football_v4.0.sqlite 2>/dev/null || echo 0"' 2>/tmp/fly-ssh.err | tail -n 1 | tr -dc '0-9' || true)
            if [ "${DB_SIZE:-0}" -ge 104857600 ] 2>/dev/null; then
              break
            fi
            echo "Fly SSH/DB probe attempt $attempt failed or returned DB_SIZE=${DB_SIZE:-0}"
            cat /tmp/fly-ssh.err || true
            sleep 5
          done
          echo "Production Engine DB bytes: ${DB_SIZE:-0}"
          test "${DB_SIZE:-0}" -ge 104857600

      - name: Run read-only production certifications
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE="${{ steps.flymachine.outputs.machine }}"
          run_remote() {
            output="$1"
            module="$2"
            for attempt in 1 2 3 4 5 6; do
              if flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python -m $module'" > "$output" 2> "$output.err"; then
                test -s "$output" && return 0
              fi
              echo "Certification SSH attempt $attempt failed for $module"
              cat "$output.err" || true
              sleep 5
            done
            return 1
          }
          run_remote story-question-quality.json tools.director_v05.certify_story_question_quality
          run_remote story-game-reach.json tools.director_v05.certify_story_game_reach

      - name: Run production-volume queue certification on shadow DB
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE="${{ steps.flymachine.outputs.machine }}"
          SHADOW="/tmp/reads-story-volume-cert-engine"
          cleanup() {
            flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'rm -rf $SHADOW'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Copy Engine modules and take a SQLite-consistent online backup.
          # All queue mutations below happen only inside this disposable copy.
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'rm -rf $SHADOW && mkdir -p $SHADOW && cp /data/engine/*.py $SHADOW/ && python -c \"import sqlite3; src=sqlite3.connect(\\\"file:/data/engine/reads_football_v4.0.sqlite?mode=ro\\\", uri=True); dst=sqlite3.connect(\\\"$SHADOW/reads_football_v4.0.sqlite\\\"); src.backup(dst); dst.close(); src.close()\"'"

          # 20 x 5-candidate micro-batches exercises the real claim/checkpoint/
          # retry path at production shape while keeping runtime bounded.
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=$SHADOW && python -m tools.director_v05.certify_story_volume --batch-size 5 --max-batches 20 --time-budget-seconds 1200 --min-claimed 25'" > story-volume-cert.json 2> story-volume-cert.err

      - name: Print certification results
        if: always()
        run: |
          set +e
          echo "===== QUESTION QUALITY ====="
          cat story-question-quality.json 2>/dev/null || true
          echo
          echo "===== GAME REACH ====="
          cat story-game-reach.json 2>/dev/null || true
          echo
          echo "===== PRODUCTION VOLUME ====="
          cat story-volume-cert.json 2>/dev/null || true
          exit 0

      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-production-certification
          path: |
            story-question-quality.json
            story-question-quality.err
            story-game-reach.json
            story-game-reach.err
            story-volume-cert.json
            story-volume-cert.err
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce certification result
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; q=json.load(open("story-question-quality.json")); g=json.load(open("story-game-reach.json")); v=json.load(open("story-volume-cert.json")); print("quality", q.get("status"), q.get("promotion_ready")); print("reach", g.get("games_with_story_content"), "/", g.get("games_tested"), g.get("promotion_ready")); print("volume", v.get("status"), "claimed", v.get("claimed_total"), "generated_delta", v.get("generated_delta"), v.get("promotion_ready")); sys.exit(0 if q.get("promotion_ready") and g.get("promotion_ready") and v.get("promotion_ready") else 1)'
