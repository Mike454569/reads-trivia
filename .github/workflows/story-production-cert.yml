name: Story Production Certification

on:
  push:
    branches:
      - 'story-prod-cert-trigger-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Certify live Story Factory DB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly access and production DB
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          test -n "${FLY_API_TOKEN:-}"
          flyctl status -a "$APP"
          DB_SIZE=$(flyctl ssh console -a "$APP" -C 'sh -lc "stat -c %s /data/engine/reads_football_v4.0.sqlite 2>/dev/null || echo 0"' | tail -n 1 | tr -dc '0-9')
          echo "Production Engine DB bytes: $DB_SIZE"
          test "${DB_SIZE:-0}" -ge 104857600

      - name: Package current certification source
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github --exclude='*.sqlite' --exclude='*.sqlite-*' -czf /tmp/reads-story-cert.tgz .

      - name: Upload certification source to Fly tmp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh sftp put /tmp/reads-story-cert.tgz /tmp/reads-story-cert.tgz -a reads-football-gateway

      - name: Run read-only production certifications
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console -a reads-football-gateway -C "sh -lc 'rm -rf /tmp/reads-story-cert && mkdir -p /tmp/reads-story-cert && tar -xzf /tmp/reads-story-cert.tgz -C /tmp/reads-story-cert && cd /tmp/reads-story-cert && export PYTHONPATH=/tmp/reads-story-cert && export READS_ENGINE_DIR=/data/engine && python -m tools.director_v05.certify_story_question_quality > /tmp/story-question-quality.json 2> /tmp/story-question-quality.err || true; python -m tools.director_v05.certify_story_game_reach > /tmp/story-game-reach.json 2> /tmp/story-game-reach.err || true; test -s /tmp/story-question-quality.json; test -s /tmp/story-game-reach.json'"

      - name: Download certification outputs
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          flyctl ssh sftp get /tmp/story-question-quality.json story-question-quality.json -a reads-football-gateway
          flyctl ssh sftp get /tmp/story-question-quality.err story-question-quality.err -a reads-football-gateway
          flyctl ssh sftp get /tmp/story-game-reach.json story-game-reach.json -a reads-football-gateway
          flyctl ssh sftp get /tmp/story-game-reach.err story-game-reach.err -a reads-football-gateway
          exit 0

      - name: Print certification results
        if: always()
        run: |
          set +e
          echo "===== QUESTION QUALITY ====="
          cat story-question-quality.json 2>/dev/null || true
          echo
          echo "===== QUESTION QUALITY STDERR ====="
          cat story-question-quality.err 2>/dev/null || true
          echo
          echo "===== GAME REACH ====="
          cat story-game-reach.json 2>/dev/null || true
          echo
          echo "===== GAME REACH STDERR ====="
          cat story-game-reach.err 2>/dev/null || true
          exit 0

      - name: Upload certification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-production-certification
          path: |
            story-question-quality.json
            story-question-quality.err
            story-game-reach.json
            story-game-reach.err
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce certification result
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; q=json.load(open("story-question-quality.json")); g=json.load(open("story-game-reach.json")); print("quality", q.get("status"), q.get("promotion_ready")); print("reach", g.get("games_with_story_content"), "/", g.get("games_tested"), g.get("promotion_ready")); sys.exit(0 if q.get("promotion_ready") and g.get("promotion_ready") else 1)'
