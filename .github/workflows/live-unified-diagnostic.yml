name: Live unified format diagnostic

on:
  push:
    branches: [fix/gameplay-launch-and-factfake]
    paths:
      - ".github/workflows/live-unified-diagnostic.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live gateway paths
        shell: bash
        run: |
          set -euo pipefail
          base="https://reads-football-gateway.fly.dev"
          probe() {
            name="$1"; url="$2"; limit="${3:-12}"
            start=$(date +%s%3N)
            code=$(curl -sS -o "/tmp/$name.json" -w "%{http_code}" --max-time "$limit" "$url" || true)
            end=$(date +%s%3N)
            echo "LIVE-PROBE $name status=$code ms=$((end-start))"
            head -c 800 "/tmp/$name.json" 2>/dev/null || true
            echo
          }
          probe health "$base/v1/health" 5
          probe ready "$base/v1/ready" 5
          probe formats_list "$base/v1/public/formats" 8
          probe old_mechanic "$base/v1/public/mechanics/round?mode=matching_nfl_draft" 12
          probe old_game "$base/v1/public/game?mode=draft_guess&client_id=diagnostic" 12
          probe unified_mechanic "$base/v1/public/formats/round?mode=matching_nfl_draft" 12
