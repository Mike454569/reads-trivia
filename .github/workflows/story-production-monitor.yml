name: Story Production Cert Process Diagnostic

on:
  push:
    branches:
      - 'story-prod-monitor-*'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Find live certification process
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'for d in /proc/[0-9]*; do cmd=$(tr \"\\000\" \" \" < \"$d/cmdline\" 2>/dev/null || true); case \"$cmd\" in *certify_story*) echo \"${d##*/} $cmd\";; esac; done'"
