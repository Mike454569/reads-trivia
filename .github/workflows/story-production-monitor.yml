name: Story Stale Reader Cleanup

on:
  push:
    branches:
      - 'story-prod-monitor-*'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Kill only stale Story delivery-check reader
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'python3 -c \"import os,signal,base64,re; victims=[]; for_n=[]; [(for_n.append(n)) for n in os.listdir(\\\"/proc\\\") if n.isdigit() and os.path.exists(\\\"/proc/\\\"+n+\\\"/cmdline\\\")]; [None for n in for_n]; rows=[]; [(rows.append((int(n),open(\\\"/proc/\\\"+n+\\\"/cmdline\\\",\\\"rb\\\").read().replace(b\\\"\\\\x00\\\",b\\\" \\\").decode(\\\"utf-8\\\",\\\"replace\\\")))) for n in for_n]; [(victims.append(p)) for p,c in rows if (lambda m: bool(m) and b\\\"prod-story-delivery\\\" in base64.b64decode(m.group(1)))(re.search(r\\\"base64\\.b64decode\\(\\\\\\\"([^\\\\\\\"]+)\\\\\\\"\\)\\\",c))]; print(\\\"delivery_reader_pids\\\",victims); [os.kill(p,signal.SIGTERM) for p in victims]\"'" || true
