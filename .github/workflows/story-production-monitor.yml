name: Story Source Connectivity Check

on:
  push:
    branches:
      - 'story-prod-monitor-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Test exact live GDELT fetch
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python -c \"import json,traceback; from tools.director_v05.story_candidate_harvest import _fetch; q=\\\"(\\\\\\\"press conference\\\\\\\") (NFL OR \\\\\\\"college football\\\\\\\") domainis:nfl.com\\\"; print(json.dumps(_fetch(q,max_records=2,timespan=\\\"1y\\\",timeout=10),sort_keys=True)[:12000])\"'"
