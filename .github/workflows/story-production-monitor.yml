name: Story Production Lock Diagnostic

on:
  push:
    branches:
      - 'story-prod-monitor-*'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Diagnose live Engine DB lock
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'echo ===PROCESSES===; ps -ef | grep -E \"python|uvicorn|gunicorn\" | grep -v grep || true; echo ===LSOF===; (command -v lsof >/dev/null && lsof /data/engine/reads_football_v4.0.sqlite) || true; echo ===FUSER===; (command -v fuser >/dev/null && fuser -v /data/engine/reads_football_v4.0.sqlite) || true; echo ===SQLITE===; cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python -c \"import sqlite3,json; p=\\\"/data/engine/reads_football_v4.0.sqlite\\\"; c=sqlite3.connect(\\\"file:\\\"+p+\\\"?mode=ro\\\",uri=True,timeout=2); tabs={r[0] for r in c.execute(\\\"select name from sqlite_master where type=\\\\\\\"table\\\\\\\"\\\")}; out={\\\"journal_mode\\\":c.execute(\\\"pragma journal_mode\\\").fetchone()[0],\\\"locking_mode\\\":c.execute(\\\"pragma locking_mode\\\").fetchone()[0],\\\"refresh_runs_exists\\\":\\\"refresh_runs\\\" in tabs}; out[\\\"recent_refresh_runs\\\"]=[dict(zip([d[0] for d in cur.description],row)) for cur in [c.execute(\\\"select * from refresh_runs order by started_at desc limit 12\\\")] for row in cur.fetchall()] if \\\"refresh_runs\\\" in tabs else []; print(json.dumps(out,default=str,sort_keys=True)); c.close()\"'"

