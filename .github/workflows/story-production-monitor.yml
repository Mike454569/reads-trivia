name: Clear Story Cert Readers And Probe Writer

on:
  push:
    branches:
      - 'story-prod-monitor-*'

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Stop only certification processes and probe SQLite writer
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "python3 -c 'import os,signal,json; hits=[]; needles=(\"tools.director_v05.certify_story_\",\"tools.director_v05.run_story_prod_cert_bundle\"); me=os.getpid();
          
          for n in [x for x in os.listdir(\"/proc\") if x.isdigit() and int(x)!=me]:
          
              try:
                  a=[x.decode(\"utf-8\",\"replace\") for x in open(\"/proc/\"+n+\"/cmdline\",\"rb\").read().split(b\"\\0\") if x]
                  cmd=\" \".join(a)
                  if any(k in cmd for k in needles): hits.append({\"pid\":int(n),\"argv\":a}); os.kill(int(n),signal.SIGTERM)
              except Exception: pass
          
          print(json.dumps(hits,sort_keys=True))'"
          sleep 2
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export READS_ENGINE_DIR=/data/engine && python3 -c \"from tools.quiz_export import engine as e; c=e.connect(); c.execute(\\\"BEGIN IMMEDIATE\\\"); print(\\\"WRITE_LOCK_ACQUIRED\\\"); c.rollback(); c.close()\"'"
