name: Story Production DB FD Scan

on:
  push:
    branches:
      - 'story-prod-monitor-*'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Scan live processes with DB file descriptors
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "python3 -c 'import base64; exec(base64.b64decode(\"\"))'"
