name: Story Reliability Tests

on:
  push:
    branches:
      - 'story-reliability-tests-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run Story Factory reliability tests
        run: |
          set -euo pipefail
          python -m pytest -q             tools/director_v05/tests/test_story_batch_processor.py             tools/director_v05/tests/test_cfb_story_candidate_harvest.py
