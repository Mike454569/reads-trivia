name: Recover Fly gateway

on:
  push:
    branches: [fix/gameplay-launch-and-factfake]
    paths:
      - ".github/workflows/live-fly-recover.yml"

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Restart production machine and verify
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          app="reads-football-gateway"
          id=$(flyctl machines list -a "$app" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); print(next(str(r.get('id') or r.get('ID')) for r in rows if (r.get('state') or r.get('State'))=='started' and not str(r.get('name','')).startswith('ci-')))")
          echo "Restarting $id"
          flyctl machine restart "$id" -a "$app"
          base="https://reads-football-gateway.fly.dev"
          ok=0
          for attempt in {1..18}; do
            health=$(curl -fsS --max-time 5 "$base/v1/health" || true)
            ready=$(curl -fsS --max-time 8 "$base/v1/ready" || true)
            if echo "$health" | grep -q '"status"' && echo "$ready" | grep -q '"status"'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          curl -fsS --max-time 12 "$base/v1/public/formats/round?mode=matching_nfl_draft" | head -c 1200
          echo
