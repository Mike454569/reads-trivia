name: Story Process Check

on:
  push:
    branches:
      - 'story-process-check-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect Story worker processes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and str(r.get('state') or '').lower()=='started' and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'python3 -c \"import os,base64,re,json; out=[]; rows=[]; [(rows.append((int(n),open(\\\"/proc/\\\"+n+\\\"/cmdline\\\",\\\"rb\\\").read().replace(b\\\"\\\\x00\\\",b\\\" \\\").decode(\\\"utf-8\\\",\\\"replace\\\")))) for n in os.listdir(\\\"/proc\\\") if n.isdigit() and os.path.exists(\\\"/proc/\\\"+n+\\\"/cmdline\\\")]; [(out.append({\\\"pid\\\":p,\\\"bulk_fast\\\":bool((lambda m: m and b\\\"BATCH_TARGET=40\\\" in base64.b64decode(m.group(1)))(re.search(r\\\"base64\\.b64decode\\(\\\\\\\"([^\\\\\\\"]+)\\\\\\\"\\)\\\",c))),\\\"delivery_check\\\":bool((lambda m: m and b\\\"prod-story-delivery\\\" in base64.b64decode(m.group(1)))(re.search(r\\\"base64\\.b64decode\\(\\\\\\\"([^\\\\\\\"]+)\\\\\\\"\\)\\\",c)))}) ) for p,c in rows if \\\"base64.b64decode\\\" in c]; print(json.dumps(out,sort_keys=True))\"'"
