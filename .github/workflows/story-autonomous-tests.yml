name: Story Autonomous Tests

on:
  push:
    branches:
      - 'story-autonomous-tests-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r gateway/requirements.txt
      - name: Run Story checkpoint tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tools/director_v05/tests/test_story_batch_processor.py \
            tools/director_v05/tests/test_story_batch_drain.py
