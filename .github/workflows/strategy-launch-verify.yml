name: Strategy launch verify
on:
  push:
    branches: [fix/strategy-launch-live]
    paths:
      - ".github/workflows/strategy-launch-verify.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run strategy arcade contracts
        run: |
          python -m py_compile tools/director_v04/strategy_arcade.py tools/director_v04/deep_trivia.py
          python - <<'PY'
          from tools.director_v04 import strategy_arcade
          sample = [{
              "category": "Test",
              "prompt": f"Question {i}?",
              "correct_label": "A",
              "decoy_labels": ["B","C","D"],
              "notes": "verified",
              "difficulty": "Medium",
              "depth_source": "fixture",
              "bucket": "Test",
          } for i in range(6)]
          original = strategy_arcade.deep_trivia.generate_fast_arcade_rounds
          strategy_arcade.deep_trivia.generate_fast_arcade_rounds = lambda seed, n: sample[:n]
          try:
              pkg = strategy_arcade.build_package("smoke", "BINGO_BLITZ", round_count=6)
              assert pkg["qa_status"] == "PASSED"
              assert len(pkg["rounds"]) == 6
              assert pkg["rounds"][0]["_answer_item_id"] in {"A","B","C","D"}
              print("strategy runtime contract OK")
          finally:
              strategy_arcade.deep_trivia.generate_fast_arcade_rounds = original
          PY
