name: Gateway tests
# CI nudge: retrigger real-DB gate after frontend/art bundle updates.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches: [main, feature/retention-moat-upgrades]
    paths:
      - "gateway/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "tools/**"
      - ".github/workflows/gateway-tests.yml"

concurrency:
  group: gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      # This suite has no fixture/mock database -- most tests open the real,
      # multi-GB reads_football_v4.0.sqlite, correctly gitignored and absent
      # on a fresh checkout. CI_SKIP_DB_TESTS=1 (see conftest.py's
      # pytest_collection_modifyitems) marks the node IDs empirically known
      # to need that database as SKIPPED rather than FAILED, so this job
      # gives a real, meaningful signal on the tests that never needed a
      # database -- not full coverage, but a genuine gate rather than a
      # permanently-red or rubber-stamped one. IMPORTANT: whenever a new
      # DB-dependent test is added anywhere under gateway/tests/,
      # regenerate gateway/tests/.ci_needs_real_db.txt (see conftest.py's
      # comment right above pytest_collection_modifyitems for how) -- a new
      # test not yet on that list runs for real here against an empty
      # auto-created sqlite file and fails (this exact mistake happened
      # once, in the Lineup Concurrency pass -- see PRODUCTION_STATUS.md).
      # Verified locally against a simulated fresh checkout (no DB
      # present): 435 passed, 670 skipped, 0 failed.
      - name: Audit distinct game formats
        run: python tools/audit_game_formats.py

      - name: Run 100-format audit and strategy regressions
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
          CI_SKIP_DB_TESTS: "1"
        run: |
          python -m pytest gateway/tests/test_100_format_audit.py gateway/tests/test_100_format_discovery_hub.py gateway/tests/test_100_format_production_closeout.py gateway/tests/test_football_101_question_depth.py gateway/tests/test_strategy_arcade_wave2.py gateway/tests/test_strategy_arcade_wave3.py gateway/tests/test_strategy_arcade_wave4.py gateway/tests/test_strategy_arcade_wave5.py -q

      - name: Run universal engine v05 contracts
        run: python -m pytest tests/test_director_v05_universal.py -q

      - name: Run gateway test suite (DB-independent subset)
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
          CI_SKIP_DB_TESTS: "1"
        run: python -m pytest gateway/tests -q


  certified-db-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      - name: Build certified lightweight Reads DB
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
        run: |
          python tools/ci/build_certified_ci_db.py --engine-dir "$READS_ENGINE_DIR"
          ls -lh "$READS_ENGINE_DIR/reads_football_v4.0.sqlite"

      - name: Run certified DB contract tests
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
        run: python -m pytest gateway/tests/test_certified_ci_fixture.py -q


  # Full-coverage job: same suite, but against the REAL database, copied
  # from production via an isolated Fly volume fork (a block-level test copy,
  # never a fabricated mock and never the live mounted production volume).
  # Needs a FLY_API_TOKEN repo secret this pass could not create (no `gh`
  # CLI / GitHub API write access in this environment) -- see
  # PRODUCTION_STATUS.md's CI section for the exact remaining step. Until
  # that secret exists, this job is skipped (not failing) rather than red.
  integration-tests-with-real-db:
    # The multi-GB Fly volume fork is a diagnostic full-coverage run, not a
    # per-push merge/deploy gate. Fly volume forks can fail independently of
    # application code. Run it explicitly or on the daily schedule; the
    # certified DB contract job remains the deterministic per-push DB gate.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/fix/public-mechanics-launch-latency')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN is configured
        id: check_token
        run: echo "has_token=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check_token.outputs.has_token == 'true'
        with:
          python-version: "3.11"

      - name: Install flyctl
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version

      # Real-DB CI uses a temporary independent volume fork, specifically
      # intended by Fly for testing/experimentation. The fork and its helper
      # Machine are always destroyed below, even if copying or tests fail.
      - name: Fork real DB volume for integration tests
        if: steps.check_token.outputs.has_token == 'true'
        id: restore
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
          FLY_REGION: iad
          SOURCE_VOLUME: reads_engine_data
        run: |
          set -euo pipefail
          TEMP_VOL_NAME="ci_fork_${GITHUB_RUN_ID}"
          TEMP_MACHINE_NAME="ci-db-${GITHUB_RUN_ID}"

          # Multiple long-lived Fly Machines/volumes can share the same
          # human-readable volume name. Probe only file metadata (stat) on
          # each running production Machine and select the Machine whose
          # mounted Reads DB is genuinely populated; then fork THAT volume.
          MACHINES_JSON=$("$HOME/.fly/bin/flyctl" machines list -a "$FLY_APP" --json)
          PROD_MACHINE_IDS=$(printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; rows=json.load(sys.stdin); print(' '.join(str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))))")
          SOURCE_VOLUME_ID=""
          for PROD_MACHINE_ID in $PROD_MACHINE_IDS; do
            DB_SIZE=$(timeout 45s "$HOME/.fly/bin/flyctl" ssh console -a "$FLY_APP" --machine "$PROD_MACHINE_ID" \
              -C 'sh -lc "stat -c %s /data/engine/reads_football_v4.0.sqlite 2>/dev/null || echo 0"' 2>/dev/null | tail -n 1 | tr -dc '0-9' || true)
            DB_SIZE=${DB_SIZE:-0}
            echo "Production machine $PROD_MACHINE_ID DB bytes: $DB_SIZE"
            if [ "$DB_SIZE" -gt 104857600 ]; then
              SOURCE_VOLUME_ID=$(printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; mid='$PROD_MACHINE_ID'; rows=json.load(sys.stdin); r=next(x for x in rows if str(x.get('id') or x.get('ID'))==mid); mounts=(r.get('config') or {}).get('mounts',[]); ids=[m.get('volume') or m.get('volume_id') for m in mounts if m.get('volume') or m.get('volume_id')]; print(ids[0] if ids else '')")
              break
            fi
          done
          if [ -z "$SOURCE_VOLUME_ID" ]; then
            echo "No running production Machine has a populated Reads DB" >&2
            exit 1
          fi
          echo "Forking verified production volume $SOURCE_VOLUME_ID into isolated CI copy"

          echo "Forking with an 8-minute hard timeout so Fly cannot pin CI indefinitely"
          FORK_JSON=$(timeout 8m "$HOME/.fly/bin/flyctl" volumes fork "$SOURCE_VOLUME_ID" \
            -a "$FLY_APP" --region "$FLY_REGION" --name "$TEMP_VOL_NAME" --json) || {
              rc=$?
              echo "Fly volume fork failed or timed out (exit $rc)" >&2
              exit "$rc"
            }
          TEMP_VOL_ID=$(printf '%s' "$FORK_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "temp_volume_id=$TEMP_VOL_ID" >> "$GITHUB_OUTPUT"

          # Run the real-DB suite beside the fork instead of copying the
          # multi-GB SQLite database back through Fly SSH/SFTP. A disposable
          # Alpine helper reliably supports Fly SSH; Python/test dependencies
          # are installed only inside this isolated CI machine.
          timeout 3m "$HOME/.fly/bin/flyctl" machine run alpine:3.20 \
            -a "$FLY_APP" --region "$FLY_REGION" --volume "${TEMP_VOL_ID}:/data" \
            --name "$TEMP_MACHINE_NAME" --entrypoint "tail -f /dev/null" \
            --memory 1024 --detach

          TEMP_MACHINE_ID=$("$HOME/.fly/bin/flyctl" machines list -a "$FLY_APP" --json | \
            python3 -c "import json,sys; name='$TEMP_MACHINE_NAME'; rows=json.load(sys.stdin); print(next((r.get('id') or r.get('ID')) for r in rows if (r.get('name') or r.get('Name'))==name))")
          echo "temp_machine_id=$TEMP_MACHINE_ID" >> "$GITHUB_OUTPUT"
          "$HOME/.fly/bin/flyctl" machine wait "$TEMP_MACHINE_ID" -a "$FLY_APP" --wait-timeout 2m

          # Fly can report the Machine started a few seconds before its SSH
          # server accepts connections. Gate the source upload on actual SSH
          # readiness rather than racing the guest boot.
          SSH_READY=0
          for attempt in $(seq 1 30); do
            if "$HOME/.fly/bin/flyctl" ssh console -a "$FLY_APP" --machine "$TEMP_MACHINE_ID" -C "true" >/dev/null 2>&1; then
              SSH_READY=1
              break
            fi
            echo "Waiting for helper SSH (attempt $attempt/30)"
            sleep 2
          done
          if [ "$SSH_READY" != "1" ]; then
            echo "Helper Machine never became SSH-ready" >&2
            exit 1
          fi

          # Ship the branch source to the helper. This is intentionally the
          # inverse of the old design: move a small source archive to Fly,
          # never the multi-GB production database away from Fly.
          SRC_ARCHIVE="$RUNNER_TEMP/reads-ci-src.tgz"
          tar \
            --exclude='.git' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite-*' \
            --exclude='*.db' \
            --exclude='node_modules' \
            --exclude='.venv' \
            -czf "$SRC_ARCHIVE" .
          timeout 3m "$HOME/.fly/bin/flyctl" ssh sftp put "$SRC_ARCHIVE" /tmp/reads-ci-src.tgz \
            -a "$FLY_APP" --machine "$TEMP_MACHINE_ID"

          timeout 22m "$HOME/.fly/bin/flyctl" ssh console -a "$FLY_APP" --machine "$TEMP_MACHINE_ID" \
            -C "sh -lc 'set -eu; apk add --no-cache python3 py3-pip; rm -rf /tmp/reads-ci; mkdir -p /tmp/reads-ci; tar -xzf /tmp/reads-ci-src.tgz -C /tmp/reads-ci; chmod +x /tmp/reads-ci/tools/ci/run_real_db_tests.sh; /tmp/reads-ci/tools/ci/run_real_db_tests.sh'"


      # Always runs, even if an earlier step failed -- a temporary volume or
      # machine must never be left behind accumulating real Fly cost. Safe
      # to run even if restore never got far enough to set these outputs
      # (empty values just make the flyctl calls no-ops/errors that this
      # step ignores with `|| true`, rather than failing the cleanup itself).
      - name: Clean up temporary Fly volume and machine
        if: always() && steps.check_token.outputs.has_token == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
        run: |
          if [ -n "${{ steps.restore.outputs.temp_machine_id }}" ]; then
            "$HOME/.fly/bin/flyctl" machine destroy "${{ steps.restore.outputs.temp_machine_id }}" -a "$FLY_APP" --force || true
          fi
          if [ -n "${{ steps.restore.outputs.temp_volume_id }}" ]; then
            "$HOME/.fly/bin/flyctl" volumes destroy "${{ steps.restore.outputs.temp_volume_id }}" -a "$FLY_APP" --yes || true
          fi

          # If a Fly command timed out before outputs were written, sweep by
          # deterministic CI names so orphan resources cannot accumulate.
          TEMP_MACHINE_NAME="ci-db-${GITHUB_RUN_ID}"
          TEMP_VOL_NAME="ci_fork_${GITHUB_RUN_ID}"
          MACHINE_IDS=$("$HOME/.fly/bin/flyctl" machines list -a "$FLY_APP" --json | python3 -c "import json,sys; name='$TEMP_MACHINE_NAME'; print(' '.join(str(r.get('id') or r.get('ID')) for r in json.load(sys.stdin) if (r.get('name') or r.get('Name'))==name and (r.get('id') or r.get('ID'))))" || true)
          for id in $MACHINE_IDS; do "$HOME/.fly/bin/flyctl" machine destroy "$id" -a "$FLY_APP" --force || true; done
          VOLUME_IDS=$("$HOME/.fly/bin/flyctl" volumes list -a "$FLY_APP" --json | python3 -c "import json,sys; name='$TEMP_VOL_NAME'; print(' '.join(str(r.get('id') or r.get('ID')) for r in json.load(sys.stdin) if (r.get('name') or r.get('Name'))==name and (r.get('id') or r.get('ID'))))" || true)
          for id in $VOLUME_IDS; do "$HOME/.fly/bin/flyctl" volumes destroy "$id" -a "$FLY_APP" --yes || true; done

      - name: Report skipped (no token)
        if: steps.check_token.outputs.has_token != 'true'
        run: echo "Skipped -- FLY_API_TOKEN secret not set. See PRODUCTION_STATUS.md."
