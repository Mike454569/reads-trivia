name: Gateway tests

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "tools/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "tools/**"
      - ".github/workflows/gateway-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      # This suite has no fixture/mock database -- most tests open the real,
      # multi-GB reads_football_v4.0.sqlite, correctly gitignored and absent
      # on a fresh checkout. CI_SKIP_DB_TESTS=1 (see conftest.py's
      # pytest_collection_modifyitems) marks the node IDs empirically known
      # to need that database as SKIPPED rather than FAILED, so this job
      # gives a real, meaningful signal on the tests that never needed a
      # database -- not full coverage, but a genuine gate rather than a
      # permanently-red or rubber-stamped one. IMPORTANT: whenever a new
      # DB-dependent test is added anywhere under gateway/tests/,
      # regenerate gateway/tests/.ci_needs_real_db.txt (see conftest.py's
      # comment right above pytest_collection_modifyitems for how) -- a new
      # test not yet on that list runs for real here against an empty
      # auto-created sqlite file and fails (this exact mistake happened
      # once, in the Lineup Concurrency pass -- see PRODUCTION_STATUS.md).
      # Verified locally against a simulated fresh checkout (no DB
      # present): 435 passed, 670 skipped, 0 failed.
      - name: Run gateway test suite (DB-independent subset)
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
          CI_SKIP_DB_TESTS: "1"
        run: python -m pytest gateway/tests -q

  # Full-coverage job: same suite, but against the REAL database, restored
  # from Fly's own automated daily volume snapshot (a real, reproducible
  # fixture -- not a fabricated mock that could drift from the real schema).
  # Needs a FLY_API_TOKEN repo secret this pass could not create (no `gh`
  # CLI / GitHub API write access in this environment) -- see
  # PRODUCTION_STATUS.md's CI section for the exact remaining step. Until
  # that secret exists, this job is skipped (not failing) rather than red.
  integration-tests-with-real-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN is configured
        id: check_token
        run: echo "has_token=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check_token.outputs.has_token == 'true'
        with:
          python-version: "3.11"

      - name: Install flyctl
        if: steps.check_token.outputs.has_token == 'true'
        run: curl -L https://fly.io/install.sh | sh

      # Lineup Concurrency pass: real implementation, not a TODO placeholder
      # -- but honestly caveated: every flyctl subcommand below was verified
      # to exist with this exact flag shape via `flyctl <cmd> --help` in the
      # session that wrote this (recorded so a future reader can re-check),
      # but the job as a WHOLE has never run end-to-end, because this
      # environment has no way to set FLY_API_TOKEN as a real repo secret
      # (no `gh` CLI, no GitHub API write access -- see PRODUCTION_STATUS.md).
      # Never touches the production volume or its live data: creates a
      # brand-new, separate, temporary volume FROM a snapshot (an immutable,
      # already-existing point-in-time copy) and a brand-new temporary
      # machine -- both destroyed in the cleanup step below regardless of
      # whether the tests pass, fail, or this step itself fails partway.
      - name: Restore real DB from latest Fly volume snapshot
        if: steps.check_token.outputs.has_token == 'true'
        id: restore
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
          FLY_REGION: iad
          SOURCE_VOLUME: reads_engine_data
        run: |
          set -euo pipefail
          TEMP_VOL_NAME="ci_restore_${GITHUB_RUN_ID}"

          SOURCE_VOLUME_ID=$(flyctl volumes list -a "$FLY_APP" --json | \
            python3 -c "import json,sys; vols=json.load(sys.stdin); print(next(v['id'] for v in vols if v['name']=='$SOURCE_VOLUME'))")

          LATEST_SNAPSHOT_ID=$(flyctl volumes snapshots list "$SOURCE_VOLUME_ID" -a "$FLY_APP" --json | \
            python3 -c "import json,sys; snaps=json.load(sys.stdin); print(sorted(snaps, key=lambda s: s['created_at'])[-1]['id'])")
          echo "Restoring from snapshot $LATEST_SNAPSHOT_ID (volume $SOURCE_VOLUME_ID)"

          TEMP_VOL_ID=$(flyctl volumes create "$TEMP_VOL_NAME" \
            --snapshot-id "$LATEST_SNAPSHOT_ID" -a "$FLY_APP" --region "$FLY_REGION" \
            --size 10 --yes --json | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "temp_volume_id=$TEMP_VOL_ID" >> "$GITHUB_OUTPUT"

          # Minimal machine, same app's own image (already has the sqlite3
          # CLI / python available), overridden to just idle so this job can
          # SFTP the one file it needs off the mounted volume rather than
          # actually running the Gateway process on this throwaway machine.
          TEMP_MACHINE_ID=$(flyctl machine run "registry.fly.io/${FLY_APP}:latest" \
            -a "$FLY_APP" --region "$FLY_REGION" --volume "${TEMP_VOL_ID}:/data" \
            --command "sleep 300" --detach --json | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "temp_machine_id=$TEMP_MACHINE_ID" >> "$GITHUB_OUTPUT"
          flyctl machine wait "$TEMP_MACHINE_ID" -a "$FLY_APP" --wait-timeout 2m

          mkdir -p "${{ github.workspace }}/Reads_Football_Data_Engine_v4.0"
          flyctl ssh sftp get /data/engine/reads_football_v4.0.sqlite \
            "${{ github.workspace }}/Reads_Football_Data_Engine_v4.0/reads_football_v4.0.sqlite" \
            -a "$FLY_APP" --machine "$TEMP_MACHINE_ID"

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      - name: Run full gateway test suite
        if: steps.check_token.outputs.has_token == 'true'
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
        run: python -m pytest gateway/tests -q

      # Always runs, even if an earlier step failed -- a temporary volume or
      # machine must never be left behind accumulating real Fly cost. Safe
      # to run even if restore never got far enough to set these outputs
      # (empty values just make the flyctl calls no-ops/errors that this
      # step ignores with `|| true`, rather than failing the cleanup itself).
      - name: Clean up temporary Fly volume and machine
        if: always() && steps.check_token.outputs.has_token == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
        run: |
          if [ -n "${{ steps.restore.outputs.temp_machine_id }}" ]; then
            flyctl machine destroy "${{ steps.restore.outputs.temp_machine_id }}" -a "$FLY_APP" --force || true
          fi
          if [ -n "${{ steps.restore.outputs.temp_volume_id }}" ]; then
            flyctl volumes destroy "${{ steps.restore.outputs.temp_volume_id }}" -a "$FLY_APP" --yes || true
          fi

      - name: Report skipped (no token)
        if: steps.check_token.outputs.has_token != 'true'
        run: echo "Skipped -- FLY_API_TOKEN secret not set. See PRODUCTION_STATUS.md."
