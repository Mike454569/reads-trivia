name: Gateway tests

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "tools/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "tools/**"
      - ".github/workflows/gateway-tests.yml"

concurrency:
  group: gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      # This suite has no fixture/mock database -- most tests open the real,
      # multi-GB reads_football_v4.0.sqlite, correctly gitignored and absent
      # on a fresh checkout. CI_SKIP_DB_TESTS=1 (see conftest.py's
      # pytest_collection_modifyitems) marks the node IDs empirically known
      # to need that database as SKIPPED rather than FAILED, so this job
      # gives a real, meaningful signal on the tests that never needed a
      # database -- not full coverage, but a genuine gate rather than a
      # permanently-red or rubber-stamped one. IMPORTANT: whenever a new
      # DB-dependent test is added anywhere under gateway/tests/,
      # regenerate gateway/tests/.ci_needs_real_db.txt (see conftest.py's
      # comment right above pytest_collection_modifyitems for how) -- a new
      # test not yet on that list runs for real here against an empty
      # auto-created sqlite file and fails (this exact mistake happened
      # once, in the Lineup Concurrency pass -- see PRODUCTION_STATUS.md).
      # Verified locally against a simulated fresh checkout (no DB
      # present): 435 passed, 670 skipped, 0 failed.
      - name: Audit distinct game formats
        run: python tools/audit_game_formats.py

      - name: Run 100-format audit and strategy regressions
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
          CI_SKIP_DB_TESTS: "1"
        run: |
          python -m pytest gateway/tests/test_100_format_audit.py gateway/tests/test_100_format_discovery_hub.py gateway/tests/test_100_format_production_closeout.py gateway/tests/test_football_101_question_depth.py gateway/tests/test_strategy_arcade_wave2.py gateway/tests/test_strategy_arcade_wave3.py gateway/tests/test_strategy_arcade_wave4.py gateway/tests/test_strategy_arcade_wave5.py -q

      - name: Run gateway test suite (DB-independent subset)
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
          CI_SKIP_DB_TESTS: "1"
        run: python -m pytest gateway/tests -q

  # Full-coverage job: same suite, but against the REAL database, restored
  # from Fly's own automated daily volume snapshot (a real, reproducible
  # fixture -- not a fabricated mock that could drift from the real schema).
  # Needs a FLY_API_TOKEN repo secret this pass could not create (no `gh`
  # CLI / GitHub API write access in this environment) -- see
  # PRODUCTION_STATUS.md's CI section for the exact remaining step. Until
  # that secret exists, this job is skipped (not failing) rather than red.
  integration-tests-with-real-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN is configured
        id: check_token
        run: echo "has_token=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check_token.outputs.has_token == 'true'
        with:
          python-version: "3.11"

      - name: Install flyctl
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version

      # Lineup Concurrency pass: real implementation, not a TODO placeholder
      # -- but honestly caveated: every flyctl subcommand below was verified
      # to exist with this exact flag shape via `flyctl <cmd> --help` in the
      # session that wrote this (recorded so a future reader can re-check),
      # but the job as a WHOLE has never run end-to-end, because this
      # environment has no way to set FLY_API_TOKEN as a real repo secret
      # (no `gh` CLI, no GitHub API write access -- see PRODUCTION_STATUS.md).
      # Never touches the production volume or its live data: creates a
      # brand-new, separate, temporary volume FROM a snapshot (an immutable,
      # already-existing point-in-time copy) and a brand-new temporary
      # machine -- both destroyed in the cleanup step below regardless of
      # whether the tests pass, fail, or this step itself fails partway.
      - name: Restore real DB from latest Fly volume snapshot
        if: steps.check_token.outputs.has_token == 'true'
        id: restore
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
          FLY_REGION: iad
          SOURCE_VOLUME: reads_engine_data
        run: |
          set -euo pipefail
          TEMP_VOL_NAME="ci_restore_${GITHUB_RUN_ID}"

          SOURCE_VOLUME_JSON=$("$HOME/.fly/bin/flyctl" volumes list -a "$FLY_APP" --json | \
            python3 -c "import json,sys; vols=json.load(sys.stdin); print(json.dumps(next(v for v in vols if v['name']=='$SOURCE_VOLUME')))")
          SOURCE_VOLUME_ID=$(printf '%s' "$SOURCE_VOLUME_JSON" | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          SOURCE_VOLUME_SIZE=$(printf '%s' "$SOURCE_VOLUME_JSON" | \
            python3 -c "import json,sys; v=json.load(sys.stdin); print(v.get('size_gb') or v.get('sizeGb') or v.get('size') or 30)")
          echo "Source volume $SOURCE_VOLUME_ID is ${SOURCE_VOLUME_SIZE}GB"

          LATEST_SNAPSHOT_ID=$("$HOME/.fly/bin/flyctl" volumes snapshots list "$SOURCE_VOLUME_ID" -a "$FLY_APP" --json | \
            python3 -c "import json,sys; snaps=json.load(sys.stdin); print(sorted(snaps, key=lambda s: s['created_at'])[-1]['id'])")
          echo "Restoring from snapshot $LATEST_SNAPSHOT_ID (volume $SOURCE_VOLUME_ID)"

          TEMP_VOL_ID=$("$HOME/.fly/bin/flyctl" volumes create "$TEMP_VOL_NAME" \
            --snapshot-id "$LATEST_SNAPSHOT_ID" -a "$FLY_APP" --region "$FLY_REGION" \
            --size "$SOURCE_VOLUME_SIZE" --yes --json | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "temp_volume_id=$TEMP_VOL_ID" >> "$GITHUB_OUTPUT"

          # Snapshot-backed volume creation can return while Fly is still
          # restoring bytes. A Machine cannot safely claim/start with that
          # volume until the volume reaches the stable "created" state.
          VOLUME_READY=0
          for attempt in $(seq 1 180); do
            VOLUME_STATE=$("$HOME/.fly/bin/flyctl" volumes show "$TEMP_VOL_ID" -a "$FLY_APP" --json | \
              python3 -c "import json,sys; v=json.load(sys.stdin); print(v.get('state') or v.get('State') or '')")
            echo "Restore volume state: $VOLUME_STATE (attempt $attempt/180)"
            if [ "$VOLUME_STATE" = "created" ]; then
              VOLUME_READY=1
              break
            fi
            if [ "$VOLUME_STATE" = "failed" ]; then
              echo "Snapshot restore entered failed state" >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$VOLUME_READY" != "1" ]; then
            echo "Snapshot restore did not become ready before timeout" >&2
            exit 1
          fi

          # Create a helper Machine directly through the Machines API instead
          # of inheriting the production app entrypoint. Its only job is to
          # keep the restored snapshot mounted long enough for SFTP.
          TEMP_MACHINE_NAME="ci-restore-${GITHUB_RUN_ID}"
          PROD_IMAGE_REF=$("$HOME/.fly/bin/flyctl" machines list -a "$FLY_APP" --json | \
            python3 -c "import json,sys; rows=json.load(sys.stdin); print(next((r.get('config') or {}).get('image') for r in rows if (r.get('config') or {}).get('image')))")
          echo "Using deployed production image ref for restore helper"
          export TEMP_MACHINE_NAME PROD_IMAGE_REF TEMP_VOL_ID FLY_REGION
          MACHINE_PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"name":os.environ["TEMP_MACHINE_NAME"],"region":os.environ["FLY_REGION"],"skip_launch":True,"config":{"image":os.environ["PROD_IMAGE_REF"],"auto_destroy":False,"processes":[{"name":"ci-restore","cmd":["sleep","600"]}],"mounts":[{"volume":os.environ["TEMP_VOL_ID"],"path":"/data"}],"guest":{"cpu_kind":"shared","cpus":1,"memory_mb":256}}}))')
          TEMP_MACHINE_JSON=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${FLY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.machines.dev/v1/apps/${FLY_APP}/machines" \
            -d "$MACHINE_PAYLOAD")
          TEMP_MACHINE_ID=$(printf '%s' "$TEMP_MACHINE_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "temp_machine_id=$TEMP_MACHINE_ID" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${FLY_API_TOKEN}" \
            "https://api.machines.dev/v1/apps/${FLY_APP}/machines/${TEMP_MACHINE_ID}/start" >/dev/null
          "$HOME/.fly/bin/flyctl" machine wait "$TEMP_MACHINE_ID" -a "$FLY_APP" --wait-timeout 2m

          mkdir -p "${{ github.workspace }}/Reads_Football_Data_Engine_v4.0"
          "$HOME/.fly/bin/flyctl" ssh sftp get /data/engine/reads_football_v4.0.sqlite \
            "${{ github.workspace }}/Reads_Football_Data_Engine_v4.0/reads_football_v4.0.sqlite" \
            -a "$FLY_APP" --machine "$TEMP_MACHINE_ID"

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      - name: Run full gateway test suite
        if: steps.check_token.outputs.has_token == 'true'
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
        run: python -m pytest gateway/tests -q

      # Always runs, even if an earlier step failed -- a temporary volume or
      # machine must never be left behind accumulating real Fly cost. Safe
      # to run even if restore never got far enough to set these outputs
      # (empty values just make the flyctl calls no-ops/errors that this
      # step ignores with `|| true`, rather than failing the cleanup itself).
      - name: Clean up temporary Fly volume and machine
        if: always() && steps.check_token.outputs.has_token == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
        run: |
          if [ -n "${{ steps.restore.outputs.temp_machine_id }}" ]; then
            "$HOME/.fly/bin/flyctl" machine destroy "${{ steps.restore.outputs.temp_machine_id }}" -a "$FLY_APP" --force || true
          fi
          if [ -n "${{ steps.restore.outputs.temp_volume_id }}" ]; then
            "$HOME/.fly/bin/flyctl" volumes destroy "${{ steps.restore.outputs.temp_volume_id }}" -a "$FLY_APP" --yes || true
          fi

      - name: Report skipped (no token)
        if: steps.check_token.outputs.has_token != 'true'
        run: echo "Skipped -- FLY_API_TOKEN secret not set. See PRODUCTION_STATUS.md."
