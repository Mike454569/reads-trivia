name: Gateway tests

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "tools/**"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "gateway/**"
      - "tools/**"
      - ".github/workflows/gateway-tests.yml"

concurrency:
  group: gateway-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      # This suite has no fixture/mock database -- most tests open the real,
      # multi-GB reads_football_v4.0.sqlite, correctly gitignored and absent
      # on a fresh checkout. CI_SKIP_DB_TESTS=1 (see conftest.py's
      # pytest_collection_modifyitems) marks the node IDs empirically known
      # to need that database as SKIPPED rather than FAILED, so this job
      # gives a real, meaningful signal on the tests that never needed a
      # database -- not full coverage, but a genuine gate rather than a
      # permanently-red or rubber-stamped one. IMPORTANT: whenever a new
      # DB-dependent test is added anywhere under gateway/tests/,
      # regenerate gateway/tests/.ci_needs_real_db.txt (see conftest.py's
      # comment right above pytest_collection_modifyitems for how) -- a new
      # test not yet on that list runs for real here against an empty
      # auto-created sqlite file and fails (this exact mistake happened
      # once, in the Lineup Concurrency pass -- see PRODUCTION_STATUS.md).
      # Verified locally against a simulated fresh checkout (no DB
      # present): 435 passed, 670 skipped, 0 failed.
      - name: Audit distinct game formats
        run: python tools/audit_game_formats.py

      - name: Run 100-format audit and strategy regressions
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
          CI_SKIP_DB_TESTS: "1"
        run: |
          python -m pytest gateway/tests/test_100_format_audit.py gateway/tests/test_100_format_discovery_hub.py gateway/tests/test_100_format_production_closeout.py gateway/tests/test_football_101_question_depth.py gateway/tests/test_strategy_arcade_wave2.py gateway/tests/test_strategy_arcade_wave3.py gateway/tests/test_strategy_arcade_wave4.py gateway/tests/test_strategy_arcade_wave5.py -q

      - name: Run gateway test suite (DB-independent subset)
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
          CI_SKIP_DB_TESTS: "1"
        run: python -m pytest gateway/tests -q

  # Full-coverage job: same suite, but against the REAL database, copied
  # from production via an isolated Fly volume fork (a block-level test copy,
  # never a fabricated mock and never the live mounted production volume).
  # Needs a FLY_API_TOKEN repo secret this pass could not create (no `gh`
  # CLI / GitHub API write access in this environment) -- see
  # PRODUCTION_STATUS.md's CI section for the exact remaining step. Until
  # that secret exists, this job is skipped (not failing) rather than red.
  integration-tests-with-real-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN is configured
        id: check_token
        run: echo "has_token=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check_token.outputs.has_token == 'true'
        with:
          python-version: "3.11"

      - name: Install flyctl
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version

      # Real-DB CI uses a temporary independent volume fork, specifically
      # intended by Fly for testing/experimentation. The fork and its helper
      # Machine are always destroyed below, even if copying or tests fail.
      - name: Fork real DB volume for integration tests
        if: steps.check_token.outputs.has_token == 'true'
        id: restore
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
          FLY_REGION: iad
          SOURCE_VOLUME: reads_engine_data
        run: |
          set -euo pipefail
          TEMP_VOL_NAME="ci_fork_${GITHUB_RUN_ID}"
          TEMP_MACHINE_NAME="ci-db-${GITHUB_RUN_ID}"

          # Resolve the volume mounted by the live production Machine.
          # Volume names are not unique forever on Fly; selecting the first
          # name match previously picked a stale/empty reads_engine_data.
          SOURCE_VOLUME_ID=$("$HOME/.fly/bin/flyctl" machines list -a "$FLY_APP" --json | \
            python3 -c "import json,sys; rows=json.load(sys.stdin); live=[r for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-')]; mounts=[m for r in live for m in (r.get('config') or {}).get('mounts',[])]; ids=[m.get('volume') or m.get('volume_id') for m in mounts if m.get('volume') or m.get('volume_id')]; print(ids[0] if ids else '')")
          if [ -z "$SOURCE_VOLUME_ID" ]; then
            echo "Could not resolve a mounted production volume from the live Fly Machine" >&2
            exit 1
          fi
          echo "Forking live production-mounted volume $SOURCE_VOLUME_ID into isolated CI copy"

          TEMP_VOL_ID=$("$HOME/.fly/bin/flyctl" volumes fork "$SOURCE_VOLUME_ID" \
            -a "$FLY_APP" --region "$FLY_REGION" --name "$TEMP_VOL_NAME" --json | \
            python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "temp_volume_id=$TEMP_VOL_ID" >> "$GITHUB_OUTPUT"

          # fly machine run handles the physical host placement required by
          # Fly volumes. Alpine has no Reads entrypoint, secrets, services, or
          # production behavior: it only keeps the isolated fork mounted.
          "$HOME/.fly/bin/flyctl" machine run alpine:3.20 \
            -a "$FLY_APP" --region "$FLY_REGION" --volume "${TEMP_VOL_ID}:/data" \
            --name "$TEMP_MACHINE_NAME" --entrypoint "tail -f /dev/null" \
            --memory 256 --detach

          TEMP_MACHINE_ID=$("$HOME/.fly/bin/flyctl" machines list -a "$FLY_APP" --json | \
            python3 -c "import json,sys; name='$TEMP_MACHINE_NAME'; rows=json.load(sys.stdin); print(next((r.get('id') or r.get('ID')) for r in rows if (r.get('name') or r.get('Name'))==name))")
          echo "temp_machine_id=$TEMP_MACHINE_ID" >> "$GITHUB_OUTPUT"
          "$HOME/.fly/bin/flyctl" machine wait "$TEMP_MACHINE_ID" -a "$FLY_APP" --wait-timeout 2m

          # Never trust a hard-coded pathname here: old/stale zero-byte
          # SQLite placeholders can survive on the production volume. Find
          # the largest non-empty SQLite database on the isolated fork,
          # expose it at a deterministic path with a zero-copy hard link, and validate it before pytest.
          "$HOME/.fly/bin/flyctl" ssh console -a "$FLY_APP" --machine "$TEMP_MACHINE_ID" \
            -C 'sh -lc "set -eu; best=; best_size=0; for f in $(find /data -type f 2>/dev/null); do case \"$f\" in *.sqlite|*.db) size=$(stat -c %s \"$f\" 2>/dev/null || echo 0); echo candidate $size $f; if [ \"$size\" -gt \"$best_size\" ]; then best=\"$f\"; best_size=\"$size\"; fi ;; esac; done; [ \"$best_size\" -gt 104857600 ] || { echo No-large-production-DB-found >&2; exit 1; }; echo Selected $best $best_size bytes; ln \"$best\" /data/ci_reads_real.sqlite; sync"'

          mkdir -p "${{ github.workspace }}/Reads_Football_Data_Engine_v4.0"
          LOCAL_DB="${{ github.workspace }}/Reads_Football_Data_Engine_v4.0/reads_football_v4.0.sqlite"
          "$HOME/.fly/bin/flyctl" ssh sftp get /data/ci_reads_real.sqlite "$LOCAL_DB" \
            -a "$FLY_APP" --machine "$TEMP_MACHINE_ID"

          python3 - <<'PY'
          import os, sqlite3
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "Reads_Football_Data_Engine_v4.0", "reads_football_v4.0.sqlite")
          size = os.path.getsize(path)
          if size <= 100 * 1024 * 1024:
              raise SystemExit(f"Real DB copy is unexpectedly small: {size} bytes")
          con = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
          try:
              row = con.execute("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='games'").fetchone()
              if not row or row[0] != 1:
                  tables = [r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name LIMIT 25")]
                  raise SystemExit(f"Copied DB is not the Reads production DB; games table missing. First tables: {tables}")
              game_count = con.execute("SELECT COUNT(*) FROM games").fetchone()[0]
              if game_count <= 0:
                  raise SystemExit("Copied Reads DB has an empty games table")
              print(f"Validated real DB: {size} bytes, games={game_count}")
          finally:
              con.close()
          PY

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt

      - name: Run full gateway test suite
        if: steps.check_token.outputs.has_token == 'true'
        env:
          READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
        run: python -m pytest gateway/tests -q

      # Always runs, even if an earlier step failed -- a temporary volume or
      # machine must never be left behind accumulating real Fly cost. Safe
      # to run even if restore never got far enough to set these outputs
      # (empty values just make the flyctl calls no-ops/errors that this
      # step ignores with `|| true`, rather than failing the cleanup itself).
      - name: Clean up temporary Fly volume and machine
        if: always() && steps.check_token.outputs.has_token == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: reads-football-gateway
        run: |
          if [ -n "${{ steps.restore.outputs.temp_machine_id }}" ]; then
            "$HOME/.fly/bin/flyctl" machine destroy "${{ steps.restore.outputs.temp_machine_id }}" -a "$FLY_APP" --force || true
          fi
          if [ -n "${{ steps.restore.outputs.temp_volume_id }}" ]; then
            "$HOME/.fly/bin/flyctl" volumes destroy "${{ steps.restore.outputs.temp_volume_id }}" -a "$FLY_APP" --yes || true
          fi

      - name: Report skipped (no token)
        if: steps.check_token.outputs.has_token != 'true'
        run: echo "Skipped -- FLY_API_TOKEN secret not set. See PRODUCTION_STATUS.md."
