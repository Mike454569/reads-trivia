name: Story Production Adapter Check

on:
  push:
    branches:
      - 'story-prod-adaptercheck-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check live Story adapters
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          SCRIPT_B64=$(base64 -w0 tools/director_v05/story_adapter_check_once.py)
          for attempt in 1 2 3 4 5; do
            if flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python3 -c \"import base64; exec(base64.b64decode(\\\"$SCRIPT_B64\\\"))\"'" > story-adapter-check.json 2> story-adapter-check.err; then
              cat story-adapter-check.json
              test -s story-adapter-check.json
              exit 0
            fi
            cat story-adapter-check.err || true
            sleep 3
          done
          exit 1
