name: New game launch timeout cert
on:
  push:
    branches: [fix/new-game-launch-timeout]
    paths:
      - ".github/workflows/new-game-launch-timeout-cert.yml"
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run frontend timeout regression
        run: pytest -q gateway/tests/test_public_formats.py -k frontend_launch_timeout_covers_real_production_budget
      - name: Probe heavy live modes with browser origin
        shell: bash
        run: |
          set -euo pipefail
          base="https://reads-football-gateway.fly.dev"
          for mode in perfect_drive_nfl bingo_blitz_mixed championship_run_mixed; do
            start=$(date +%s%3N)
            code=$(curl -sS -D "/tmp/$mode.headers" -o "/tmp/$mode.json" -w "%{http_code}" --max-time 30 \
              -H "Origin: https://reads.football" \
              "$base/v1/public/mechanics/round?mode=$mode")
            end=$(date +%s%3N)
            ms=$((end-start))
            echo "$mode status=$code ms=$ms"
            grep -i '^access-control-allow-origin: https://reads.football' "/tmp/$mode.headers"
            test "$code" = "200"
            grep -q '"round_id"' "/tmp/$mode.json"
          done
