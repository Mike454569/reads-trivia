name: Story Production Exclusive Seed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-production-exclusive-writer
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve live Fly machine
        id: flymachine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          echo "machine=$MACHINE" >> "$GITHUB_OUTPUT"

      - name: Clear temporary Story writer processes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE="${{ steps.flymachine.outputs.machine }}"
          for sweep in 1; do
            flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'python3 -c \"import os,signal; pats=(\\\"run_story_to_trivia_factory\\\",\\\"reviewed_story_seed_once\\\",\\\"native_story_harvest_once\\\",\\\"base64.\\\"+\\\"b64decode\\\"); me=os.getpid(); killed=[]; [(os.kill(int(n),signal.SIGTERM),killed.append(int(n))) for n in os.listdir(\\\"/proc\\\") if n.isdigit() and int(n)!=me and all(x not in (open(\\\"/proc/\\\"+n+\\\"/cmdline\\\",\\\"rb\\\").read().replace(b\\\"\\\\x00\\\",b\\\" \\\").decode(\\\"utf-8\\\",\\\"ignore\\\")) for x in (\\\"uvicorn\\\",\\\"gunicorn\\\")) and any(p in open(\\\"/proc/\\\"+n+\\\"/cmdline\\\",\\\"rb\\\").read().replace(b\\\"\\\\x00\\\",b\\\" \\\").decode(\\\"utf-8\\\",\\\"ignore\\\") for p in pats)]; print(\\\"killed\\\",killed)\"'" || true
            sleep 5
          done

      - name: Seed reviewed Story corpus and generate questions
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE="${{ steps.flymachine.outputs.machine }}"
          SCRIPT_B64=$(base64 -w0 tools/director_v05/reviewed_story_seed_once.py)
          for attempt in 1 2 3; do
            if flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python3 -c \"import base64; exec(base64.b64decode(\\\"$SCRIPT_B64\\\"))\"'" > story-reviewed-seed.json 2> story-reviewed-seed.err; then
              test -s story-reviewed-seed.json && break
            fi
            echo "seed attempt $attempt failed"
            cat story-reviewed-seed.err || true
            sleep 10
          done
          cat story-reviewed-seed.json
          test -s story-reviewed-seed.json

      - name: Read final Story Factory health and QA
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE="${{ steps.flymachine.outputs.machine }}"
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python -c \"import json; from tools.quiz_export import engine as e; from tools.director_v05.story_factory_health import story_factory_health; from tools.director_v05.certify_story_question_quality import certify_story_question_quality; c=e.connect(); print(json.dumps({\\\"health\\\":story_factory_health(c),\\\"quality\\\":certify_story_question_quality(c)},sort_keys=True)); c.close()\"'" > story-final-health.json
          cat story-final-health.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-exclusive-seed-production
          path: |
            story-reviewed-seed.json
            story-reviewed-seed.err
            story-final-health.json
          if-no-files-found: warn
          retention-days: 7
