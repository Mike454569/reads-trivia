name: Browser launch diagnostic
on:
  push:
    branches: [diag/browser-launch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live all-wave Strategy Arcade
        shell: bash
        run: |
          set -euo pipefail
          base="https://reads-football-gateway.fly.dev"
          failed=0
          for mode in bingo_blitz_mixed connect_four_mixed red_zone_ladder_mixed championship_run_mixed perfect_drive_nfl; do
            start=$(date +%s%3N)
            code=$(curl -sS -D "/tmp/$mode.headers" -o "/tmp/$mode.json" -w "%{http_code}" --max-time 10 \
              -H "Origin: https://reads.football" \
              "$base/v1/public/mechanics/round?mode=$mode" || true)
            end=$(date +%s%3N)
            ms=$((end-start))
            echo "LIVE $mode status=$code ms=$ms"
            grep -i '^access-control-allow-origin:' "/tmp/$mode.headers" || true
            head -c 500 "/tmp/$mode.json" 2>/dev/null || true
            echo
            if [ "$code" != "200" ]; then failed=1; fi
          done
          exit "$failed"
