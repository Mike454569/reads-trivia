name: Browser launch diagnostic
on:
  push:
    branches: [diag/browser-launch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Start and submit live Strategy Arcade rounds
        shell: bash
        run: |
          set -euo pipefail
          base="https://reads-football-gateway.fly.dev"
          failed=0
          for mode in bingo_blitz_mixed championship_run_mixed; do
            curl -sS -o "/tmp/$mode.start.json" --max-time 12               -H "Origin: https://reads.football"               "$base/v1/public/mechanics/round?mode=$mode"
            rid=$(python -c "import json; d=json.load(open('/tmp/$mode.start.json')); print(d['round_id'])")
            phase=$(python -c "import json; d=json.load(open('/tmp/$mode.start.json')); print(d['view'].get('phase',''))")
            echo "START $mode round=$rid phase=$phase"
            if [ "$phase" = "QUESTION" ]; then
              sub=$(python -c "import json; d=json.load(open('/tmp/$mode.start.json')); print(json.dumps({'submission':{'choice_item_id':d['view']['options'][0]['item_id']}}))")
            else
              sub=$(python -c "import json; d=json.load(open('/tmp/$mode.start.json')); print(json.dumps({'submission':{'action':d['view']['actions'][0]['id']}}))")
            fi
            code=$(curl -sS -D "/tmp/$mode.submit.h" -o "/tmp/$mode.submit.json" -w "%{http_code}" --max-time 12               -H "Origin: https://reads.football" -H "Content-Type: application/json"               -X POST --data "$sub"               "$base/v1/public/mechanics/round/$rid/submit" || true)
            echo "SUBMIT $mode status=$code payload=$sub"
            cat "/tmp/$mode.submit.json"
            echo
            if [ "$code" != "200" ]; then failed=1; fi
          done
          exit "$failed"
