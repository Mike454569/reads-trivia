name: Browser launch diagnostic
on:
  push:
    branches: [diag/browser-launch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Who Am I v2
        shell: bash
        run: |
          set -euo pipefail
          base="https://reads-football-gateway.fly.dev"
          curl -sS -o /tmp/start.json --max-time 15 -H "Origin: https://reads.football" "$base/v1/public/mechanics/round?mode=who_am_i_nfl"
          python -c "import json; d=json.load(open('/tmp/start.json')); v=d['view']; clues=v.get('clues') or []; print('START_STATUS',d.get('mode'),v.get('phase')); print('CLUE1',clues[-1].get('display_text') if clues else None); print('CLUES_VISIBLE',len(clues)); assert d['mode']=='who_am_i_nfl'; assert clues; first=clues[-1].get('display_text','').lower(); assert 'listed nfl position was' not in first; assert 'reached the nfl postseason as an active roster player' not in first; open('/tmp/rid','w').write(d['round_id'])"
          rid=$(cat /tmp/rid)
          curl -sS -o /tmp/reveal.json --max-time 15 -H "Origin: https://reads.football" -H "Content-Type: application/json" -X POST --data '{"submission":{"action":"reveal_next_clue"}}' "$base/v1/public/mechanics/round/$rid/submit"
          python -c "import json; d=json.load(open('/tmp/reveal.json')); v=d['view']; clues=v.get('clues') or []; print('REVEAL_RESULT',d.get('result')); print('CLUES_VISIBLE',len(clues)); [print('CLUE'+str(i+1),c.get('display_text')) for i,c in enumerate(clues)]; assert len(clues)>=2"
