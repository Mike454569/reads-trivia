name: Story Fly Machine State Check

on:
  push:
    branches:
      - 'story-fly-machine-check-*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: List machine states
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machines list -a reads-football-gateway --json | tee machines.json
