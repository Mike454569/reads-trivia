name: Deploy gateway to Fly
# Final deploy nudge after Creator prompt/catalog sync.
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'tools/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:
concurrency:
  group: deploy-reads-gateway
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Reattach gateway to known-good Engine volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          REGION="iad"
          GOOD_VOLUME="vol_r7ygxo6owqg5ke9r"

          MACHINES_JSON=$(flyctl machines list -a "$APP" --json)
          ATTACHED=$(printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; v='$GOOD_VOLUME'; rows=json.load(sys.stdin); print(' '.join(str(r.get('id') or r.get('ID')) for r in rows if any((m.get('volume') or m.get('volume_id'))==v for m in (r.get('config') or {}).get('mounts',[]))))")

          if [ -z "$ATTACHED" ]; then
            TEMPLATE=$(printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))]; print(ids[0] if ids else '')")
            if [ -z "$TEMPLATE" ]; then
              echo "No template machine exists to clone." >&2
              exit 1
            fi
            echo "Cloning machine $TEMPLATE onto known-good Engine volume $GOOD_VOLUME"
            flyctl machine clone "$TEMPLATE" -a "$APP" --region "$REGION" --attach-volume "$GOOD_VOLUME:/data"
            MACHINES_JSON=$(flyctl machines list -a "$APP" --json)
            ATTACHED=$(printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; v='$GOOD_VOLUME'; rows=json.load(sys.stdin); print(' '.join(str(r.get('id') or r.get('ID')) for r in rows if any((m.get('volume') or m.get('volume_id'))==v for m in (r.get('config') or {}).get('mounts',[]))))")
          fi

          if [ -z "$ATTACHED" ]; then
            echo "Failed to attach a machine to known-good Engine volume $GOOD_VOLUME" >&2
            exit 1
          fi

          echo "Known-good Engine volume attached to: $ATTACHED"
          KEEP=$(printf '%s' "$ATTACHED" | awk '{print $1}')
          ALL_PROD=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); print(' '.join(str(r.get('id') or r.get('ID')) for r in rows if not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))))")
          for id in $ALL_PROD; do
            if [ "$id" != "$KEEP" ]; then
              echo "Destroying blank/duplicate production machine $id"
              flyctl machine destroy "$id" -a "$APP" --force
            fi
          done

          DB_SIZE=$(flyctl ssh console -a "$APP" --machine "$KEEP" -C 'sh -lc "stat -c %s /data/engine/reads_football_v4.0.sqlite 2>/dev/null || echo 0"' | tail -n 1 | tr -dc '0-9')
          echo "Verified production Engine DB bytes: $DB_SIZE"
          if [ "${DB_SIZE:-0}" -lt 104857600 ]; then
            echo "Known-good volume did not expose the populated Reads DB; refusing deploy." >&2
            exit 1
          fi

      - name: Deploy Reads gateway
        run: flyctl deploy . --config gateway/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Repair live capability catalog drift
        run: |
          # Catalog repair is maintenance, not the deployment health gate.
          # Retry because a freshly replaced Fly Machine can be running before
          # SSH is ready; if SSH stays unavailable, live /health + /ready below
          # remains the authoritative deployment gate.
          repaired=0
          for attempt in {1..6}; do
            if flyctl ssh console -a reads-football-gateway -C "python3 -c \"import sys; sys.path.insert(0,'/app'); from tools.data_refresh.repair_capability_catalog_drift import repair_missing_catalog_rows; print(repair_missing_catalog_rows())\""; then
              repaired=1
              break
            fi
            echo "Catalog repair SSH not ready (attempt $attempt/6)"
            sleep 10
          done
          if [ "$repaired" != "1" ]; then
            echo "::warning::Catalog repair could not run over SSH; continuing to authoritative live health/readiness verification."
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Run v0.5 production Engine stress certification
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); print(next(str(r.get('id') or r.get('ID')) for r in rows if not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))))")
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export READS_ENGINE_DIR=/data/engine && python3 -m tools.director_v05.stress_harness --max-facts-per-adapter 5000 --max-players 1000 --out /tmp/v05-stress.json && python3 -c \"import json; from tools.director_v05.stress_certification import assert_certified; r=json.load(open(\\\"/tmp/v05-stress.json\\\")); print(json.dumps(assert_certified(r), indent=2, sort_keys=True))\"'"

      - name: Verify live gateway
        run: |
          for attempt in {1..12}; do
            health=$(curl -fsS --max-time 15 https://reads-football-gateway.fly.dev/v1/health || true)
            ready=$(curl -fsS --max-time 15 https://reads-football-gateway.fly.dev/v1/ready || true)
            if echo "$health" | grep -q '"status"' && echo "$ready" | grep -q '"status"'; then
              echo "Gateway health and readiness checks passed."
              exit 0
            fi
            sleep 10
          done
          echo "Gateway did not become healthy after deployment."
          exit 1
