name: Deploy gateway to Fly
# Final deploy nudge after Creator prompt/catalog sync.
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'tools/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:
concurrency:
  group: deploy-reads-gateway
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Remove stale stopped Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINES_JSON=$(flyctl machines list -a "$APP" --json)
          STARTED_COUNT=$(printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; rows=json.load(sys.stdin); print(sum(1 for r in rows if str(r.get('state','')).lower()=='started' and not str(r.get('name','')).startswith('ci-')))")
          STOPPED_IDS=$(printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; rows=json.load(sys.stdin); print(' '.join(str(r.get('id') or r.get('ID')) for r in rows if str(r.get('state','')).lower()=='stopped' and not str(r.get('name','')).startswith('ci-') and (r.get('id') or r.get('ID'))))")
          if [ "$STARTED_COUNT" -ge 1 ] && [ -n "$STOPPED_IDS" ]; then
            echo "Healthy started production machine exists; removing stale stopped machine(s): $STOPPED_IDS"
            for id in $STOPPED_IDS; do
              flyctl machine destroy "$id" -a "$APP" --force
            done
          else
            echo "No stale stopped production machine removed (started=$STARTED_COUNT)."
          fi

      - name: Deploy Reads gateway
        run: flyctl deploy . --config gateway/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Repair live capability catalog drift
        run: |
          flyctl ssh console -a reads-football-gateway -C "python3 -c \"import sys; sys.path.insert(0,'/app'); from tools.data_refresh.repair_capability_catalog_drift import repair_missing_catalog_rows; print(repair_missing_catalog_rows())\""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify live gateway
        run: |
          for attempt in {1..12}; do
            health=$(curl -fsS --max-time 15 https://reads-football-gateway.fly.dev/v1/health || true)
            ready=$(curl -fsS --max-time 15 https://reads-football-gateway.fly.dev/v1/ready || true)
            if echo "$health" | grep -q '"status"' && echo "$ready" | grep -q '"status"'; then
              echo "Gateway health and readiness checks passed."
              exit 0
            fi
            sleep 10
          done
          echo "Gateway did not become healthy after deployment."
          exit 1
