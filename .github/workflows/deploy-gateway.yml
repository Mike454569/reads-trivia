name: Deploy gateway to Fly
# Final deploy nudge after Creator prompt/catalog sync.
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'tools/**'
      - '.github/workflows/deploy-gateway.yml'
  workflow_dispatch:
concurrency:
  group: deploy-reads-gateway
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Remove known unhealthy duplicate Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          BAD_MACHINE="e820d65c36ed58"
          MACHINES_JSON=$(flyctl machines list -a "$APP" --json)
          if printf '%s' "$MACHINES_JSON" | python3 -c "import json,sys; bad='$BAD_MACHINE'; rows=json.load(sys.stdin); raise SystemExit(0 if any(str(r.get('id') or r.get('ID'))==bad for r in rows) else 1)"; then
            echo "Destroying repeat-failing duplicate Fly machine $BAD_MACHINE"
            flyctl machine destroy "$BAD_MACHINE" -a "$APP" --force
          else
            echo "Known bad machine already absent."
          fi
          REMAINING=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if not str(r.get('name','')).startswith('ci-')]; print(' '.join(ids)); print(len(ids), file=sys.stderr)")
          echo "Remaining production machines: $REMAINING"

      - name: Deploy Reads gateway
        run: flyctl deploy . --config gateway/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Repair live capability catalog drift
        run: |
          flyctl ssh console -a reads-football-gateway -C "python3 -c \"import sys; sys.path.insert(0,'/app'); from tools.data_refresh.repair_capability_catalog_drift import repair_missing_catalog_rows; print(repair_missing_catalog_rows())\""
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify live gateway
        run: |
          for attempt in {1..12}; do
            health=$(curl -fsS --max-time 15 https://reads-football-gateway.fly.dev/v1/health || true)
            ready=$(curl -fsS --max-time 15 https://reads-football-gateway.fly.dev/v1/ready || true)
            if echo "$health" | grep -q '"status"' && echo "$ready" | grep -q '"status"'; then
              echo "Gateway health and readiness checks passed."
              exit 0
            fi
            sleep 10
          done
          echo "Gateway did not become healthy after deployment."
          exit 1
