name: Direct game launch diagnostic
on:
  push:
    branches: [diag/direct-game-launch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe direct mechanic routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://reads-football-gateway.fly.dev"
          modes=(matching_nfl_draft perfect_drive_nfl risk_it_nfl fact_or_fake_nfl)
          failed=0
          for mode in "${modes[@]}"; do
            start=$(date +%s%3N)
            code=$(curl -sS -o "/tmp/${mode}.json" -w "%{http_code}" --max-time 12 "$base/v1/public/mechanics/round?mode=$mode" || true)
            end=$(date +%s%3N)
            ms=$((end-start))
            echo "DIRECT $mode status=$code ms=$ms"
            head -c 500 "/tmp/${mode}.json" 2>/dev/null || true
            echo
            if [ "$code" != "200" ]; then failed=1; fi
          done
          exit "$failed"
