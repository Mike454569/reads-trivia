name: Story Autonomous Runner Tests

on:
  push:
    branches:
      - 'story-autonomous-tests-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r gateway/requirements.txt
      - name: Run checkpoint and drain tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q             tools/director_v05/tests/test_story_batch_processor.py             tools/director_v05/tests/test_story_batch_drain.py
