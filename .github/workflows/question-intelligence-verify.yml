name: Question Intelligence verification
on:
  push:
    branches: [engine/question-intelligence-v1]
    paths:
      - ".github/workflows/question-intelligence-verify.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python -m py_compile tools/director_v04/question_intelligence.py
          python -m py_compile tools/director_v04/deep_trivia.py
          python -m py_compile tools/director_v02/pipeline.py
      - name: Intelligence unit checks
        run: |
          python - <<'PY'
          from tools.director_v04 import question_intelligence as qi

          bad={"question":"This event was classified as a Trade.","options":["Trade","Contract","Draft","Waiver"],"answer":"Trade"}
          shallow={"question":"What was Alabama's record in 2005?","options":["10-2","9-3","8-4","7-5"],"answer":"10-2"}
          deep={"question":"Which quarterback, after winning the Heisman Trophy in 2010, was selected No. 1 overall in the 2011 NFL Draft and later won NFL MVP?","options":["Cam Newton","Andrew Luck","Robert Griffin III","Matthew Stafford"],"answer":"Cam Newton","depth_source":"cross_table"}
          sb=qi.score_question(bad)
          ss=qi.score_question(shallow)
          sd=qi.score_question(deep,source="cross_table")
          print("scores",sb,ss,sd)
          assert sb["score"] < 50
          assert sd["score"] >= 68
          assert sd["score"] > ss["score"]

          a={"question":"Which team won the Super Bowl following the 2019 NFL season?","answer":"Kansas City Chiefs"}
          b={"question":"Which team won the Super Bowl following the 2020 NFL season?","answer":"Tampa Bay Buccaneers"}
          assert qi.semantic_fingerprint(a)==qi.semantic_fingerprint(b)

          d=qi.select_smart_distractors("Ohio State",["Ohio","Oregon","Michigan State","Alabama","Ohio State"],count=3,seed="x")
          print("distractors",d)
          assert len(d)==3 and len(set(d))==3 and "Ohio State" not in d
          PY
      - name: Director package annotation
        run: |
          python - <<'PY'
          from tools.director_v02 import pipeline
          spec={"mechanic":"guess","domain":"NFL_DRAFT","relationship_predicate":"DRAFTED_BY","question_count":1,"difficulty":"medium","filters":{},"exclusions":[]}
          p=pipeline.run(spec=spec,provider="mock",seed="qi-smoke")
          print(p.get("status"),p.get("question_intelligence"))
          assert p.get("questions")
          q=p["questions"][0]
          assert "question_intelligence" in q
          assert p["question_intelligence"]["question_count"]==1
          assert q["question_intelligence"]["fingerprint"]
          PY
