name: Story Factory Source Tests

on:
  push:
    branches:
      - 'story-source-tests-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run Story Factory regression tests
        run: |
          set -euo pipefail
          python -m pytest -q             tools/director_v05/tests/test_story_batch_processor.py             tools/director_v05/tests/test_story_batch_drain.py             tools/director_v05/tests/test_cfb_story_candidate_harvest.py             tools/director_v05/tests/test_story_arcade_adapter.py             tools/director_v05/tests/test_story_question_quality_cert.py             tools/director_v05/tests/test_story_shared_game_pool.py             tools/director_v05/tests/test_story_multiformat.py             tools/director_v05/tests/test_story_review_assistant.py
