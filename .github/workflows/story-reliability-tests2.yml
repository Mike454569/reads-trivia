name: Story Reliability Tests 2

on:
  push:
    branches:
      - 'story-reliability-tests2-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Stub mounted Engine bootstrap
        run: |
          mkdir -p /tmp/reads-engine-stub
          cat > /tmp/reads-engine-stub/game_factory.py <<'PY'
          import random
          import sqlite3
          def connect():
              c=sqlite3.connect(":memory:")
              c.row_factory=sqlite3.Row
              return c
          def seeded(seed):
              return random.Random(seed)
          def band(score):
              return "medium"
          PY
          echo "READS_ENGINE_DIR=/tmp/reads-engine-stub" >> "$GITHUB_ENV"
      - name: Run Story Factory reliability tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tools/director_v05/tests/test_story_batch_processor.py \
            tools/director_v05/tests/test_cfb_story_candidate_harvest.py
