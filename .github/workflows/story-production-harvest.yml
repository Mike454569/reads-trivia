name: Story Production Harvest

on:
  push:
    branches:
      - 'story-prod-harvest-*'

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve live Fly machine
        id: flymachine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          test -n "$MACHINE"
          echo "machine=$MACHINE" >> "$GITHUB_OUTPUT"

      - name: Run production Story Factory harvest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE="${{ steps.flymachine.outputs.machine }}"
          for attempt in 1 2 3 4 5 6; do
            if flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python -c \"import json; from tools.data_refresh.story_candidate_harvest_refresh import run_story_candidate_harvest; print(json.dumps(run_story_candidate_harvest(), sort_keys=True))\"'" > story-harvest.json 2> story-harvest.err; then
              test -s story-harvest.json && break
            fi
            echo "harvest attempt $attempt failed"
            cat story-harvest.err || true
            sleep 5
          done
          cat story-harvest.json
          test -s story-harvest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-production-harvest
          path: |
            story-harvest.json
            story-harvest.err
          if-no-files-found: warn
          retention-days: 7
