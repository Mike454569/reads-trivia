name: Story Native Source Production Harvest

on:
  push:
    branches:
      - 'story-prod-harvest-*'

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Populate Story Factory from official NFL and NCAA sources
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          APP="reads-football-gateway"
          MACHINE=$(flyctl machines list -a "$APP" --json | python3 -c "import json,sys; rows=json.load(sys.stdin); ids=[str(r.get('id') or r.get('ID')) for r in rows if (r.get('id') or r.get('ID')) and not str(r.get('name','')).startswith('ci-')]; print(ids[0] if ids else '')")
          flyctl ssh console -a "$APP" --machine "$MACHINE" -C "sh -lc 'cd /app && export PYTHONPATH=/app && export READS_ENGINE_DIR=/data/engine && python3 -c \"import base64; exec(base64.b64decode(\\\"  \\\"))\"'" > story-native-harvest.json 2> story-native-harvest.err
          cat story-native-harvest.json
          test -s story-native-harvest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-native-production-harvest
          path: |
            story-native-harvest.json
            story-native-harvest.err
          if-no-files-found: warn
          retention-days: 7
