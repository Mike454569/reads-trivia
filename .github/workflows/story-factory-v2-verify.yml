name: Story Factory v2 verification # rerun
on:
  push:
    branches: [engine/story-factory-v2]
    paths:
      - ".github/workflows/story-factory-v2-verify.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      READS_ENGINE_DIR: ${{ github.workspace }}/Reads_Football_Data_Engine_v4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements-dev.txt
      - name: Syntax
        run: |
          python -m py_compile tools/director_v05/story_factory_v2.py
          python -m py_compile tools/director_v05/story_multiformat.py
          python -m py_compile tools/director_v05/story_to_trivia_factory.py
      - name: Story Factory v2 regressions
        run: |
          python -m pytest             tools/director_v05/tests/test_story_factory_v2.py             tools/director_v05/tests/test_story_multiformat.py             tools/director_v05/tests/test_story_question_quality_cert.py             tools/director_v05/tests/test_story_to_trivia_factory.py             tools/director_v05/tests/test_story_arcade_adapter.py             -q
