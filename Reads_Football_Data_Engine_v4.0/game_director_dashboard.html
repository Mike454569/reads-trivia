<!doctype html><html><head><meta charset="utf-8"><title>Reads AI Game Director</title>
<style>body{font-family:system-ui;background:#f4f7fa;color:#10233a;margin:0}header{padding:28px 36px;background:#102b46;color:white}main{max-width:1100px;margin:auto;padding:24px}.box{background:white;border:1px solid #d8e2ec;border-radius:16px;padding:20px;margin-bottom:16px}textarea{width:100%;min-height:110px;font:inherit;padding:12px;box-sizing:border-box}button{background:#123e68;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:700;margin:8px 6px 0 0}pre{background:#0d1721;color:#eaf2f8;padding:18px;border-radius:12px;overflow:auto;min-height:280px}</style></head>
<body><header><h1>Reads AI Game Director — v3.0</h1><div>Describe a football game. Reads checks the data before it builds anything.</div></header>
<main><div class="box"><h2>Describe the game</h2><textarea id="q">Make a Connections game with college players who went to the same school and played the same position.</textarea><br><button onclick="go('interpret')">Interpret</button><button onclick="go('preview')">Generate Preview</button></div>
<div class="box"><h2>Director output</h2><pre id="out">Run game_director_api.py on port 8800.</pre></div></main>
<script>async function go(kind){let q=document.getElementById('q').value;let r=await fetch('http://127.0.0.1:8800/v3/director/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:q,limit:12})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
